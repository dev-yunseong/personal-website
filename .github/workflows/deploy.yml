name: CI/CD Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup SSH
        run: |
          ls -ld ~/.ssh || echo ".ssh does not exist yet."

          if [ -f ~/.ssh ]; then
          echo ".ssh exists as a FILE. Removing it."
          rm -f ~/.ssh
          fi
          
          echo "Attempting to create .ssh directory..."
          mkdir ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script
        env:
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_SERVER: ${{ secrets.SERVER_HOST }}
        run: bash deploy.sh