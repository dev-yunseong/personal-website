server:
  port: 8080
  forward-headers-strategy: native

spring:
  application:
    name: personal-website
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER}
    password: ${DATABASE_PW}
    url: jdbc:postgresql://localhost:5432/website_database
  jpa:
    hibernate:
      ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          highlight_sql: true
  security:
    user:
      name: ${APPLICATION_USER}
      password: ${APPLICATION_PW}