server:
  port: 8080
  forward-headers-strategy: native

spring:
  application:
    name: personal-website
  config:
    import: optional:file:.env[.properties]
  profiles:
    include:
      - ai
      - db
      - s3
      - apilimit
  security:
    user:
      name: ${APPLICATION_USER}
      password: ${APPLICATION_PW}

app:
  base-url: ${BASE_URL:https://yunseong.dev}
  profile-image-url: ${PROFILE_IMAGE_URL:https://s3.yunseong.dev/agent-artifacts/profile-yunseong.jpg}
