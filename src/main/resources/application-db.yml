spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER}
    password: ${DATABASE_PW}
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          highlight_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
