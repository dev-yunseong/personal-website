<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>로그인 · Yunseong Console</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-page">
    <a href="/" class="login-brand">Yunseong <span>/ CONSOLE</span></a>
    <main class="login-main" id="main">
        <section class="login-panel" aria-labelledby="form-title">
            <h1 id="form-title">로그인</h1>
            <p th:if="${param.error != null}" class="login-error" role="alert">아이디 또는 비밀번호를 확인해 주세요.</p>
            <form th:action="@{/login}" method="post">
                <label for="username">아이디</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <label class="login-remember" for="remember-me">
                    <input id="remember-me" name="remember-me" type="checkbox" value="true">
                    로그인 유지 (30일)
                </label>
                <button class="admin-button" type="submit">로그인</button>
            </form>
            <a class="login-back" href="/">사이트로 돌아가기</a>
        </section>
    </main>
</body>
</html>
