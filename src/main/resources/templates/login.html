<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>로그인 · Yunseong Console</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-page">
    <a href="/" class="login-brand">Yunseong <span>/ CONSOLE</span></a>
    <main class="login-main" id="main">
        <section class="login-intro" aria-labelledby="login-title">
            <p class="admin-eyebrow">PRIVATE WORKSPACE</p>
            <h1 id="login-title">관리자 console</h1>
            <p>프로젝트 진행상황부터 사이트 운영까지.<br>관리자 console에 로그인하세요.</p>
            <div class="login-index" aria-hidden="true"><span>01 / PROJECTS</span><span>02 / AGENTS</span><span>03 / OPERATIONS</span></div>
        </section>
        <section class="login-panel" aria-labelledby="form-title">
            <p class="admin-eyebrow">ADMIN ACCESS</p>
            <h2 id="form-title">로그인</h2>
            <p class="admin-muted">관리자 계정으로 계속하세요.</p>
            <p th:if="${param.error != null}" class="login-error" role="alert">아이디 또는 비밀번호를 확인해 주세요.</p>
            <form th:action="@{/login}" method="post">
                <label for="username">아이디</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <label class="login-remember" for="remember-me">
                    <input id="remember-me" name="remember-me" type="checkbox" value="true" aria-describedby="remember-help">
                    로그인 유지
                </label>
                <p id="remember-help" class="admin-muted login-help">30일 동안 유지됩니다. 개인 기기에서만 선택하세요.</p>
                <button class="admin-button" type="submit">Console로 계속하기 <span aria-hidden="true">→</span></button>
            </form>
            <a class="login-back" href="/">← 공개 사이트로 돌아가기</a>
        </section>
    </main>
    <footer class="login-footer">YUNSEONG / PERSONAL OPERATIONS</footer>
</body>
</html>
