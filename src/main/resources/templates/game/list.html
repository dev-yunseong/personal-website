<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      th:with="
        pageTitle='Projects | Yunseong',
        pageDescription='Yunseong의 프로젝트 모음입니다. 다양한 게임과 데모를 체험해보세요.',
        pageKeywords='프로젝트, 게임, 데모, 웹 프로젝트, 개발',
        pageUrl='/public/projects'">

<th:block layout:fragment="css">
    <style>
        .game-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .game-thumbnail {
            width: 32px;
            height: 32px;
            margin-right: 10px;
            object-fit: cover;
            display: none;
        }
        .game-thumbnail.loaded {
            display: block;
        }
        .game-title-container {
            display: flex;
            align-items: center;
        }
    </style>
</th:block>

<body>
<th:block layout:fragment="content">
    <div class="container px-3 px-md-4">
        <h1 class="my-3 my-md-4">Projects</h1>
        <p class="lead">Choose a project to explore</p>
        
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 mb-4" th:each="game : ${games}">
                <a th:href="@{/public/projects/{id}(id=${game.id})}" class="text-decoration-none">
                    <div class="card game-card h-100 shadow">
                        <div class="card-body">
                            <div class="game-title-container">
                                <img th:src="${game.gameUrl + '/thumbnail.png'}" 
                                     class="game-thumbnail" 
                                     th:alt="${game.getTitle()}"
                                     onerror="this.style.display='none'"
                                     onload="this.classList.add('loaded')">
                                <h5 class="card-title mb-0" th:text="${game.getTitle()}">Game Title</h5>
                            </div>
                            <p class="card-text text-muted mt-2 small" th:text="${game.gameUrl}">Game URL</p>
                            <span class="badge bg-primary">Open</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        
        <div th:if="${games.isEmpty()}" class="alert alert-info" role="alert">
            No projects available at the moment.
        </div>
    </div>
</th:block>
</body>
</html>
