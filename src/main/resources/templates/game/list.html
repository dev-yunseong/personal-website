<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      th:with="
        pageTitle='Projects | Yunseong',
        pageDescription='Yunseong의 프로젝트 모음입니다. 다양한 게임과 데모를 체험해보세요.',
        pageKeywords='프로젝트, 게임, 데모, 웹 프로젝트, 개발',
        pageUrl='/public/projects'">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/showcase.css}">
</th:block>

<body>
<th:block layout:fragment="content">
    <div class="container px-3 px-md-4">
        <h1 class="page-title">Projects</h1>
        <p class="showcase-lede">브라우저에서 바로 실행되는 프로젝트와 데모입니다.</p>

        <div class="showcase-toolbar" th:if="${!games.isEmpty()}">
            <p class="showcase-count"><span th:text="${#lists.size(games)}">0</span> projects</p>
        </div>

        <!--
          Rows, not a card grid. The thumbnail is a probe at <gameUrl>/thumbnail.png:
          where the file exists it is a real screenshot of a real, runnable thing;
          where it 404s the inline onerror collapses it and the item stays a plain
          text row. The list is uneven by design.
        -->
        <ul class="showcase-list" th:if="${!games.isEmpty()}">
            <li class="showcase-row" th:each="game : ${games}">
                <a th:href="@{/public/projects/{id}(id=${game.id})}" class="showcase-row__link">
                    <span class="showcase-row__body">
                        <span class="showcase-row__title" th:text="${game.getTitle()}">Game Title</span>
                        <span class="showcase-row__meta">
                            <span class="showcase-status">실행 가능</span>
                            <span class="showcase-row__url" th:text="${game.gameUrl}">Game URL</span>
                        </span>
                    </span>
                    <img th:src="${game.gameUrl + '/thumbnail.png'}"
                         class="game-thumbnail showcase-row__thumb"
                         alt=""
                         loading="lazy"
                         decoding="async"
                         onerror="this.style.display='none'"
                         onload="this.classList.add('loaded')">
                </a>
            </li>
        </ul>

        <p th:if="${games.isEmpty()}" class="showcase-empty" role="status">
            No projects available at the moment.
        </p>
    </div>
</th:block>
</body>
</html>
