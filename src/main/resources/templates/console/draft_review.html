<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>초안 검토</title>
    <th:block layout:fragment="css"><link rel="stylesheet" th:href="@{/css/draft-review.css}"></th:block>
</head>
<body><div layout:fragment="content" class="container mt-4 mb-5">
    <a th:href="@{/admin/console/drafts}">← 메모 초안</a>
    <h1 class="mt-3">초안 검토 <button type="button" class="info-help" aria-label="초안 검토 도움말" data-help="삭제된 줄은 −, 추가된 줄은 +로 표시됩니다. 승인하면 아래 변경 내용이 반영됩니다."><i class="bi bi-info-circle" aria-hidden="true"></i></button></h1>
    <p><span th:text="${review.current == null ? '새 메모 생성' : '기존 메모 수정'}"></span> · <code th:text="${review.target}"></code></p>
    <p th:if="${review.current != null}"><a th:href="@{/public/memos/{id}(id=${review.current.id})}">현재 메모 보기</a> <button type="button" class="info-help" aria-label="메모 주소 안내" data-help="기존 메모 주소는 유지됩니다."><i class="bi bi-info-circle" aria-hidden="true"></i></button></p>
    <ul class="nav nav-tabs mb-3" role="tablist" aria-label="초안 보기 방식">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="draft-diff-tab" data-bs-toggle="tab" data-bs-target="#draft-diff-panel" type="button" role="tab" aria-controls="draft-diff-panel" aria-selected="true">변경 내용</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="draft-preview-tab" data-bs-toggle="tab" data-bs-target="#draft-preview-panel" type="button" role="tab" aria-controls="draft-preview-panel" aria-selected="false" tabindex="-1">미리보기</button>
        </li>
    </ul>
    <div class="tab-content">
    <section class="tab-pane show active" id="draft-diff-panel" role="tabpanel" aria-labelledby="draft-diff-tab" tabindex="0">
    <div class="draft-diff" tabindex="0" role="region" aria-label="원문과 초안의 줄 단위 변경 내용">
        <table><thead><tr><th>이전</th><th>이후</th><th>변경</th><th>본문</th></tr></thead>
            <tbody><tr th:each="line : ${review.lines}" th:class="${line.kind}">
                <td th:text="${line.oldNumber}"></td><td th:text="${line.newNumber}"></td>
                <td th:text="${line.marker}"></td><td><pre th:text="${line.text}"></pre></td>
            </tr></tbody>
        </table>
    </div>
    </section>
    <section class="tab-pane" id="draft-preview-panel" role="tabpanel" aria-labelledby="draft-preview-tab" tabindex="0">
        <iframe class="draft-preview-frame" title="초안 미리보기" sandbox="" referrerpolicy="no-referrer" th:srcdoc="${previewHtml}"></iframe>
        <p class="text-muted mt-2 mb-0">저장된 초안의 본문을 표시합니다.</p>
    </section>
    </div>
    <form id="draft-approval" method="post" class="mt-3" th:data-url="@{/admin/console/drafts/{id}/approval(id=${review.draft.id})}">
        <input type="hidden" name="revision" th:value="${review.revision}">
        <input type="hidden" name="csrfToken" th:value="${_csrf.token}">
        <input type="hidden" name="csrfHeader" th:value="${_csrf.headerName}">
        <button class="btn btn-primary" type="submit">승인하고 반영</button>
        <button class="btn btn-outline-danger" type="submit" name="action" value="reject" th:data-url="@{/admin/console/drafts/{id}(id=${review.draft.id})}">초안 삭제</button>
        <p id="approval-status" class="mt-2" role="status" aria-live="polite"></p>
    </form>
    <script th:src="@{/js/draft-review.js}" defer></script>
</div></body></html>
