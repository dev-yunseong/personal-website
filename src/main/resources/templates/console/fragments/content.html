<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Content popularity tab. Self-contained: dashboard.html only wires the nav tab
  and calls window.loadContentStats(days) when the tab is shown or the period changes.
-->
<div class="tab-pane fade" id="pane-content" role="tabpanel" th:fragment="contentTab">
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0">Content Popularity</h5>
            <div class="btn-group" role="group" aria-label="Bot traffic">
                <button class="btn btn-outline-dark btn-sm js-content-bots active" data-bots="false" type="button">봇 제외</button>
                <button class="btn btn-outline-dark btn-sm js-content-bots" data-bots="true" type="button">봇 포함</button>
            </div>
        </div>
        <div class="card-body" id="content-body">
            <div class="text-center py-4"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
        </div>
    </div>

    <script>
(function () {
    let includeBots = false;
    let days = 7;

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function publishedLabel(row) {
        return row.publishedAt ? row.publishedAt.substring(0, 10) : '-';
    }

    function lifecycleBadge(row) {
        if (!row.memoId) return '<span class="tag tag--muted">Unresolved</span>';
        return row.evergreen
            ? '<span class="tag tag--ok">Evergreen</span>'
            : '<span class="tag tag--accent">New</span>';
    }

    function titleCell(row) {
        if (!row.memoId) {
            return `<code class="text-muted">${esc(row.uri)}</code>`;
        }
        return `<a href="${esc(row.uri)}" target="_blank" rel="noopener">${esc(row.title)}</a>`;
    }

    function tableHtml(rows) {
        let html = '<div class="table-responsive"><table class="table table-hover">'
            + '<thead><tr><th>Title</th><th>Category</th><th class="num">Requests</th><th>Published</th><th>State</th></tr></thead><tbody>';
        rows.forEach(row => {
            html += `<tr>
                <td>${titleCell(row)}</td>
                <td class="cell-dim">${esc(row.category || '-')}</td>
                <td class="num">${esc(String(row.requestCount))}</td>
                <td class="mono cell-dim">${esc(publishedLabel(row))}</td>
                <td>${lifecycleBadge(row)}</td>
            </tr>`;
        });
        return html + '</tbody></table></div>';
    }

    // A ranked bar list instead of a doughnut: eight categorical hues would have
    // spent the state ramps on decoration, and a sorted bar answers "which
    // category carries the traffic" without a legend round-trip.
    function categoryBarsHtml(categories) {
        if (!categories || categories.length === 0) return '';
        const ranked = categories.slice().sort((a, b) => b.requestCount - a.requestCount);
        const max = Math.max(1, ...ranked.map(c => c.requestCount));
        const total = ranked.reduce((sum, c) => sum + c.requestCount, 0);
        let html = '<h6>Traffic by Category</h6><div class="bar-list mb-4">';
        ranked.forEach((c, i) => {
            const width = (100 * c.requestCount / max).toFixed(1);
            const share = total === 0 ? '0.0' : (100 * c.requestCount / total).toFixed(1);
            const name = esc(c.category || '-');
            html += `<div class="bar-row">
                <div class="bar-row__name" title="${name}">${name}</div>
                <div class="bar-track" role="img" aria-label="${name}: ${esc(String(c.requestCount))} requests, ${share}% of traffic">
                    <span class="bar-fill${i === 0 ? ' bar-fill--lead' : ''}" style="width:${width}%"></span>
                </div>
                <div class="bar-row__value">${esc(String(c.requestCount))} · ${share}%</div>
            </div>`;
        });
        return html + '</div>';
    }

    function load() {
        const el = document.getElementById('content-body');
        el.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';
        const url = new URL('/api/admin/console/content', location.origin);
        url.searchParams.set('days', days);
        url.searchParams.set('includeBots', includeBots);
        fetch(url, {credentials: 'same-origin'}).then(r => {
            if (!r.ok) throw new Error('API error ' + r.status);
            return r.json();
        }).then(d => {
            if (!d.content || d.content.length === 0) {
                el.innerHTML = '<div class="alert alert-info">No memo traffic in this period yet.</div>';
                return;
            }
            el.innerHTML = categoryBarsHtml(d.categories)
                + '<h6>Popular Content</h6>'
                + tableHtml(d.content);
        }).catch(() => {
            el.innerHTML = '<div class="alert alert-danger">Failed to load data.</div>';
        });
    }

    document.querySelectorAll('.js-content-bots').forEach(btn => {
        btn.addEventListener('click', () => {
            includeBots = btn.dataset.bots === 'true';
            document.querySelectorAll('.js-content-bots').forEach(other => {
                other.classList.toggle('active', other === btn);
            });
            load();
        });
    });

    window.loadContentStats = function (selectedDays) {
        days = selectedDays;
        load();
    };
})();
    </script>
</div>

</body>
</html>
