<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Traffic Sources tab. Self-contained: dashboard.html only includes this fragment
  and calls window.loadReferer(days) when the tab is shown or the period changes.
-->
<div th:fragment="referer" class="tab-pane fade" id="pane-referer" role="tabpanel">
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0">Traffic Sources by Referer</h5>
            <div class="btn-group" role="group" aria-label="Referer bot filter">
                <button class="btn btn-outline-secondary btn-sm js-ref-bots" data-bots="true" type="button">Exclude Bots</button>
                <button class="btn btn-outline-secondary btn-sm js-ref-bots" data-bots="false" type="button">All Traffic</button>
            </div>
        </div>
        <div class="card-body" id="referer-content">
            <div class="text-center py-4"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
        </div>
    </div>

    <script>
    (function () {
        let days = 7;
        let excludeBots = true;
        let page = 0;

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function share(count, total) {
            return total === 0 ? '0.0%' : (count * 100 / total).toFixed(1) + '%';
        }

        function paginationHtml(number, totalPages) {
            if (totalPages <= 1) return '';
            let html = '<nav><ul class="pagination pagination-sm flex-wrap justify-content-center">';
            html += '<li class="page-item ' + (number === 0 ? 'disabled' : '') + '"><button class="page-link" data-ref-page="' + (number - 1) + '" type="button">&laquo;</button></li>';
            const start = Math.max(0, number - 2);
            const end = Math.min(totalPages - 1, number + 2);
            if (start > 0) html += '<li class="page-item disabled"><span class="page-link">&hellip;</span></li>';
            for (let i = start; i <= end; i++) {
                html += '<li class="page-item ' + (i === number ? 'active' : '') + '"><button class="page-link" data-ref-page="' + i + '" type="button">' + (i + 1) + '</button></li>';
            }
            if (end < totalPages - 1) html += '<li class="page-item disabled"><span class="page-link">&hellip;</span></li>';
            html += '<li class="page-item ' + (number === totalPages - 1 ? 'disabled' : '') + '"><button class="page-link" data-ref-page="' + (number + 1) + '" type="button">&raquo;</button></li>';
            html += '</ul></nav>';
            return html;
        }

        // The share column carries its own CSS bar, so the channel split is
        // readable in place — a doughnut plus a legend was a second lookup for
        // data the table already held.
        function channelTableHtml(channels, total) {
            var max = Math.max.apply(null, [1].concat(channels.map(function (c) { return c.requestCount; })));
            var html = '<h6>Channels</h6><table class="table table-sm table-hover mb-0">'
                + '<thead><tr><th>Channel</th><th class="num">Requests</th><th>Share</th></tr></thead><tbody>';
            channels.forEach(function (row) {
                var label = escHtml(row.label);
                var pct = share(row.requestCount, total);
                var width = (100 * row.requestCount / max).toFixed(1);
                html += '<tr><td>' + label + '</td>'
                    + '<td class="num">' + row.requestCount + '</td>'
                    + '<td><div class="bar-cell">'
                    + '<div class="bar-track" role="img" aria-label="' + label + ': ' + row.requestCount + ' requests, ' + pct + ' of traffic">'
                    + '<span class="bar-fill' + (row.requestCount === max ? ' bar-fill--lead' : '') + '" style="width:' + width + '%"></span>'
                    + '</div><span class="bar-cell__value">' + pct + '</span></div></td></tr>';
            });
            html += '</tbody><tfoot><tr><th>Total</th><th class="num">' + total + '</th><th>100.0%</th></tr></tfoot></table>';
            return html;
        }

        function domainTableHtml(data) {
            if (!data.content || data.content.length === 0) {
                return '<div class="alert alert-info mb-0">No external referers in this period. Direct traffic carries no referer header.</div>';
            }
            let html = '<div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>External Domain</th><th class="num">Requests</th></tr></thead><tbody>';
            data.content.forEach(function (row) {
                html += '<tr><td>' + escHtml(row.label) + '</td><td class="num">' + row.requestCount + '</td></tr>';
            });
            html += '</tbody></table></div>';
            html += paginationHtml(data.number, data.totalPages);
            return html;
        }

        function render() {
            const el = document.getElementById('referer-content');
            el.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';

            const url = new URL('/api/admin/console/referer', location.origin);
            url.searchParams.set('days', days);
            url.searchParams.set('excludeBots', excludeBots);
            url.searchParams.set('refererPage', page);

            fetch(url, {credentials: 'same-origin'}).then(function (r) {
                if (!r.ok) throw new Error('API error ' + r.status + ' at /api/admin/console/referer');
                return r.json();
            }).then(function (d) {
                const total = d.channels.reduce(function (sum, c) { return sum + c.requestCount; }, 0);
                if (total === 0) {
                    el.innerHTML = '<div class="alert alert-info">No request data available yet for this period.</div>';
                    return;
                }

                el.innerHTML =
                    '<div class="mb-4">' + channelTableHtml(d.channels, total) + '</div>' +
                    '<h6>Top External Domains</h6>' +
                    domainTableHtml(d);

                el.querySelectorAll('[data-ref-page]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        page = parseInt(btn.dataset.refPage);
                        render();
                    });
                });
            }).catch(function () {
                el.innerHTML = '<div class="alert alert-danger">Failed to load data.</div>';
            });
        }

        function highlightBotFilter() {
            document.querySelectorAll('.js-ref-bots').forEach(function (btn) {
                btn.classList.toggle('active', btn.dataset.bots === String(excludeBots));
            });
        }

        document.querySelectorAll('.js-ref-bots').forEach(function (btn) {
            btn.addEventListener('click', function () {
                excludeBots = btn.dataset.bots === 'true';
                page = 0;
                highlightBotFilter();
                render();
            });
        });
        highlightBotFilter();

        // Entry point used by dashboard.html on tab activation and period change.
        window.loadReferer = function (currentDays) {
            if (currentDays !== days) page = 0;
            days = currentDays;
            render();
        };
    })();
    </script>
</div>

</body>
</html>
