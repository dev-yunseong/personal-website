<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<div th:fragment="distribution" class="tab-pane fade" id="pane-distribution" role="tabpanel">
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0">Traffic Distribution</h5>
            <div class="btn-group" role="group" aria-label="Bot traffic">
                <button class="btn btn-outline-dark btn-sm js-dist-bots active" data-bots="false" type="button">봇 제외</button>
                <button class="btn btn-outline-dark btn-sm js-dist-bots" data-bots="true" type="button">봇 포함</button>
            </div>
        </div>
        <div class="card-body" id="distribution-content">
            <div class="text-center py-4"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
        </div>
    </div>

    <script>
    (function () {
        const DAY_NAMES = ['월', '화', '수', '목', '금', '토', '일'];

        let includeBots = false;
        let days = 7;

        function escHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function heatmapHtml(rows, timeZone) {
            const max = Math.max(1, ...rows.flat());
            const total = rows.flat().reduce((sum, count) => sum + count, 0);
            let html = '<h6>Requests by Weekday and Hour</h6>';
            html += `<div class="dist-heatmap" role="img" aria-label="요일 · 시간대별 요청 히트맵. 총 ${total}건, 가장 많은 칸 ${max}건.">`;
            html += '<div></div>';
            for (let hour = 0; hour < 24; hour++) {
                html += `<div class="dist-heatmap__label">${hour % 3 === 0 ? hour : ''}</div>`;
            }
            rows.forEach((row, dayIndex) => {
                html += `<div class="dist-heatmap__label dist-heatmap__label--day">${DAY_NAMES[dayIndex]}</div>`;
                row.forEach((count, hour) => {
                    // Square root, not linear: one spike would otherwise wash out every other cell.
                    // `--i` drives a single-hue accent ramp mixed toward the sunken surface.
                    const intensity = count === 0 ? 0 : 0.12 + 0.88 * Math.sqrt(count / max);
                    html += `<div class="dist-heatmap__cell" style="--i:${intensity.toFixed(3)}"`
                        + ` title="${DAY_NAMES[dayIndex]} ${hour}시 · ${count}건"></div>`;
                });
            });
            html += '</div>';
            html += '<div class="dist-legend"><span>적음</span><span class="dist-legend__scale">'
                + [0, 0.25, 0.5, 0.75, 1].map(step => `<span class="dist-legend__step" style="--i:${step}"></span>`).join('')
                + `</span><span>많음 (최대 ${max}건)</span></div>`;
            html += `<p class="panel-note mt-2 mb-0">요일 · 시간 축은 서버 시간대(${escHtml(timeZone)}) 기준입니다.</p>`;
            return html;
        }

        function slicesHtml(title, slices) {
            const total = slices.reduce((sum, slice) => sum + slice.count, 0);
            const max = Math.max(1, ...slices.map(slice => slice.count));
            let html = `<div class="col-md-4 mb-3"><h6>${escHtml(title)}</h6>`;
            if (slices.length === 0) {
                html += '<p class="panel-note mb-0">데이터 없음</p></div>';
                return html;
            }
            slices.forEach(slice => {
                const percent = total === 0 ? 0 : 100 * slice.count / total;
                const name = escHtml(slice.name);
                html += `<div class="bar-row">
                    <div class="bar-row__name" title="${name}">${name}</div>
                    <div class="bar-track" role="img" aria-label="${name}: ${slice.count}건, ${percent.toFixed(1)}%">
                        <span class="bar-fill${slice.count === max ? ' bar-fill--lead' : ''}" style="width: ${(100 * slice.count / max).toFixed(1)}%"></span>
                    </div>
                    <div class="bar-row__value">${slice.count} · ${percent.toFixed(1)}%</div>
                </div>`;
            });
            return html + '</div>';
        }

        function render(data) {
            const el = document.getElementById('distribution-content');
            const totalRequests = data.hourOfWeekCounts.flat().reduce((sum, count) => sum + count, 0);
            if (totalRequests === 0) {
                el.innerHTML = '<div class="alert alert-info mb-0">No traffic in this period. Statistics are saved every 5 minutes.</div>';
                return;
            }
            el.innerHTML = heatmapHtml(data.hourOfWeekCounts, data.timeZone)
                + '<div class="row mt-4">'
                + slicesHtml('Device', data.devices)
                + slicesHtml('Browser', data.browsers)
                + slicesHtml('OS', data.operatingSystems)
                + '</div>';
        }

        // Called by the dashboard tab dispatch; keeps the period it was last given.
        window.loadDistribution = function (currentDays) {
            if (currentDays) days = currentDays;
            const el = document.getElementById('distribution-content');
            el.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';
            const url = new URL('/api/admin/console/distribution', location.origin);
            url.searchParams.set('days', days);
            url.searchParams.set('includeBots', includeBots);
            fetch(url, {credentials: 'same-origin'})
                .then(r => {
                    if (!r.ok) throw new Error('API error ' + r.status + ' at /api/admin/console/distribution');
                    return r.json();
                })
                .then(render)
                .catch(() => {
                    el.innerHTML = '<div class="alert alert-danger mb-0">Failed to load data.</div>';
                });
        };

        document.querySelectorAll('.js-dist-bots').forEach(btn => {
            btn.addEventListener('click', () => {
                includeBots = btn.dataset.bots === 'true';
                document.querySelectorAll('.js-dist-bots').forEach(other => {
                    other.classList.toggle('active', other === btn);
                });
                window.loadDistribution();
            });
        });
    })();
    </script>
</div>
</body>

</html>
