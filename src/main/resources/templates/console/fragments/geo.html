<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div class="tab-pane fade" id="pane-geo" role="tabpanel" th:fragment="geo">
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0">Requests by Country</h5>
            <div class="d-flex gap-3 align-items-center flex-wrap">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="geo-all-time">
                    <label class="form-check-label" for="geo-all-time">전체 기간</label>
                </div>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="geo-include-bots">
                    <label class="form-check-label" for="geo-include-bots">봇 포함</label>
                </div>
                <button class="btn btn-sm btn-primary" id="geo-backfill" type="button">
                    <i class="bi bi-database-up me-1" aria-hidden="true"></i>기존 데이터 채우기
                </button>
            </div>
        </div>
        <div class="card-body" id="geo-content" aria-live="polite">
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        let days = 7;
        let geoPage = 0;
        let selectedCountry = null;
        let selectedCityId = null;
        let requestPage = 0;
        let map = null;
        const regionNames = (() => {
            try { return new Intl.DisplayNames(['ko'], {type: 'region'}); } catch (e) { return null; }
        })();

        function escHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function flagEmoji(code) {
            if (!/^[A-Za-z]{2}$/.test(code)) return '🏳️';
            return String.fromCodePoint(...[...code.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
        }

        function countryName(code) {
            try { return regionNames ? regionNames.of(code.toUpperCase()) : code; } catch (e) { return code; }
        }

        function includeBots() {
            return document.getElementById('geo-include-bots').checked;
        }

        function selectedDays() {
            return document.getElementById('geo-all-time').checked ? 0 : days;
        }

        function csrfHeaders() {
            const token = document.querySelector('meta[name="_csrf"]');
            const header = document.querySelector('meta[name="_csrf_header"]');
            return (token && header) ? {[header.getAttribute('content')]: token.getAttribute('content')} : {};
        }

        function fetchJson(path, params) {
            const url = new URL(path, location.origin);
            Object.entries(params || {}).forEach(([key, value]) => {
                if (value !== null && value !== undefined) url.searchParams.set(key, value);
            });
            return fetch(url, {credentials: 'same-origin'}).then(response => {
                if (!response.ok) throw new Error('API error ' + response.status);
                return response.json();
            });
        }

        function loading() {
            document.getElementById('geo-content').innerHTML =
                '<div class="text-center py-4"><div class="spinner-border text-primary" role="status">' +
                '<span class="visually-hidden">Loading...</span></div></div>';
        }

        function destroyMap() {
            if (map) {
                map.remove();
                map = null;
            }
        }

        function paginationHtml(page, attribute) {
            if (!page || page.totalPages <= 1) return '';
            return '<nav aria-label="Geo requests pages"><ul class="pagination pagination-sm justify-content-center">' +
                `<li class="page-item ${page.first ? 'disabled' : ''}"><button class="page-link" ${attribute}="${page.number - 1}" type="button">&laquo;</button></li>` +
                `<li class="page-item disabled"><span class="page-link">${page.number + 1} / ${page.totalPages}</span></li>` +
                `<li class="page-item ${page.last ? 'disabled' : ''}"><button class="page-link" ${attribute}="${page.number + 1}" type="button">&raquo;</button></li>` +
                '</ul></nav>';
        }

        function renderCountryList(data) {
            destroyMap();
            const content = document.getElementById('geo-content');
            let html = '';
            if (!data.resolverAvailable) {
                html += '<div class="alert alert-warning">GeoLite2 City 데이터베이스를 찾을 수 없습니다. 새 요청의 지역 정보와 기존 데이터 채우기가 동작하지 않습니다.</div>';
            }
            if (!data.content || data.content.length === 0) {
                html += '<div class="alert alert-info mb-0">조회 기간에 해석된 국가 데이터가 없습니다. 공개 IP 요청이 저장된 뒤 다시 확인하거나 기존 데이터 채우기를 실행하세요.</div>';
                content.innerHTML = html;
                return;
            }
            html += '<div class="table-responsive"><table class="table table-striped table-hover align-middle">' +
                '<thead><tr><th>Country</th><th class="text-end">Total Requests</th></tr></thead><tbody>';
            data.content.forEach(row => {
                const code = row.countryCode || '';
                html += '<tr><td>' +
                    `<button class="geo-country-action" data-country="${escHtml(code)}" type="button" aria-label="${escHtml(countryName(code))} 상세 보기">` +
                    `<span aria-hidden="true">${flagEmoji(code)}</span><span>${escHtml(countryName(code))} <small class="text-muted">${escHtml(code)}</small></span>` +
                    '<i class="bi bi-arrow-right" aria-hidden="true"></i></button></td>' +
                    `<td class="text-end">${escHtml(row.requestCount)}</td></tr>`;
            });
            html += '</tbody></table></div>';
            html += paginationHtml(data, 'data-geo-page');
            html += `<p class="text-muted mb-0"><small>국가 미해석 요청 ${escHtml(data.unresolvedRequests)}건</small></p>`;
            content.innerHTML = html;

            content.querySelectorAll('[data-country]').forEach(button => {
                button.addEventListener('click', () => {
                    selectedCountry = button.dataset.country;
                    selectedCityId = null;
                    requestPage = 0;
                    loadCountryDetail();
                });
            });
            content.querySelectorAll('[data-geo-page]').forEach(button => {
                button.addEventListener('click', () => {
                    geoPage = Number(button.dataset.geoPage);
                    loadCountryList();
                });
            });
        }

        function loadCountryList() {
            selectedCountry = null;
            selectedCityId = null;
            requestPage = 0;
            loading();
            fetchJson('/api/admin/console/geo/countries', {
                days: selectedDays(), geoPage, includeBots: includeBots()
            }).then(renderCountryList).catch(() => {
                document.getElementById('geo-content').innerHTML =
                    '<div class="alert alert-danger mb-0">국가 데이터를 불러오지 못했습니다.</div>';
            });
        }

        function cityListHtml(cities) {
            if (!cities.length) {
                return '<div class="alert alert-light border mb-0">해석된 도시가 없습니다.</div>';
            }
            return '<div class="geo-city-list border rounded" aria-label="도시별 요청">' +
                cities.map(city => {
                    const botRate = city.requestCount ? Math.round(city.botRequestCount * 100 / city.requestCount) : 0;
                    return `<button class="geo-city-action ${String(city.cityId) === String(selectedCityId) ? 'active' : ''}" data-city-id="${escHtml(city.cityId)}" type="button">` +
                        `<span><strong>${escHtml(city.cityName || 'Unknown')}</strong><br><small class="text-muted">봇 ${botRate}% · 오차 반경 최대 ${escHtml(city.accuracyRadiusKm || '?')}km</small></span>` +
                        `<span class="badge text-bg-primary rounded-pill">${escHtml(city.requestCount)}</span></button>`;
                }).join('') + '</div>';
        }

        function renderCountryDetail(data) {
            const cities = data.content || [];
            const name = countryName(selectedCountry);
            document.getElementById('geo-content').innerHTML =
                '<div class="geo-detail-header d-flex justify-content-between align-items-start gap-3 mb-3">' +
                '<div><button class="btn btn-sm btn-link p-0 mb-2" id="geo-country-back" type="button"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>국가 목록</button>' +
                `<h4 class="mb-1">${flagEmoji(selectedCountry)} ${escHtml(name)} <small class="text-muted">${escHtml(selectedCountry)}</small></h4>` +
                '<p class="text-muted mb-0 small">도시 위치는 MaxMind 근사 위치입니다. 실제 사용자 위치를 나타내지 않습니다.</p></div>' +
                `<button class="btn btn-sm btn-outline-secondary ${selectedCityId == null ? 'd-none' : ''}" id="geo-clear-city" type="button">도시 필터 해제</button></div>` +
                '<div class="row g-3 mb-4"><div class="col-lg-8">' +
                '<div id="geo-map" class="geo-map" role="region" aria-label="도시별 요청 지도"></div>' +
                '<div id="geo-map-notice" class="small text-muted mt-2"></div></div>' +
                `<div class="col-lg-4">${cityListHtml(cities)}` +
                `<p class="small text-muted mt-2 mb-0">도시 미해석 요청 ${escHtml(data.unresolvedRequests)}건</p></div></div>` +
                '<div id="geo-requests"></div>';

            document.getElementById('geo-country-back').addEventListener('click', () => {
                loadCountryList();
            });
            const clearButton = document.getElementById('geo-clear-city');
            if (clearButton) clearButton.addEventListener('click', () => selectCity(null));
            document.querySelectorAll('[data-city-id]').forEach(button => {
                button.addEventListener('click', () => selectCity(Number(button.dataset.cityId)));
            });
            renderMap(cities);
            loadRequests();
        }

        function renderMap(cities) {
            destroyMap();
            const notice = document.getElementById('geo-map-notice');
            const container = document.getElementById('geo-map');
            if (!cities.length) {
                container.innerHTML = '<div class="d-flex h-100 align-items-center justify-content-center text-muted">표시할 도시 좌표가 없습니다.</div>';
                return;
            }
            if (!window.L) {
                container.innerHTML = '<div class="d-flex h-100 align-items-center justify-content-center text-muted">지도 라이브러리를 불러오지 못했습니다.</div>';
                return;
            }
            map = L.map(container, {scrollWheelZoom: false});
            const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            let tileFailed = false;
            tiles.on('tileerror', () => {
                if (!tileFailed) {
                    tileFailed = true;
                    notice.textContent = '배경 지도를 불러오지 못했습니다. 도시 목록과 요청 데이터는 계속 사용할 수 있습니다.';
                }
            });
            const bounds = [];
            cities.forEach(city => {
                const latLng = [city.latitude, city.longitude];
                bounds.push(latLng);
                const marker = L.circleMarker(latLng, {
                    radius: Math.min(28, Math.max(6, 4 + 3 * Math.sqrt(city.requestCount))),
                    color: '#084298',
                    weight: 2,
                    fillColor: '#0d6efd',
                    fillOpacity: String(city.cityId) === String(selectedCityId) ? 0.9 : 0.58
                }).addTo(map);
                marker.bindPopup(`<strong>${escHtml(city.cityName || 'Unknown')}</strong><br>${escHtml(city.requestCount)} requests<br>오차 반경 최대 ${escHtml(city.accuracyRadiusKm || '?')}km`);
                marker.on('click', () => selectCity(city.cityId));
            });
            if (bounds.length === 1) map.setView(bounds[0], 9);
            else map.fitBounds(bounds, {padding: [28, 28], maxZoom: 9});
            setTimeout(() => map && map.invalidateSize(), 0);
        }

        function selectCity(cityId) {
            selectedCityId = cityId;
            requestPage = 0;
            loadCountryDetail();
        }

        function loadCountryDetail() {
            loading();
            fetchJson(`/api/admin/console/geo/countries/${encodeURIComponent(selectedCountry)}/cities`, {
                days: selectedDays(), includeBots: includeBots()
            }).then(renderCountryDetail).catch(() => {
                document.getElementById('geo-content').innerHTML =
                    '<div class="alert alert-danger mb-0">국가 상세 데이터를 불러오지 못했습니다.</div>';
            });
        }

        function statusBadge(statusCode) {
            if (!statusCode) return '<span class="badge text-bg-secondary">-</span>';
            const style = statusCode >= 500 ? 'danger' : statusCode >= 400 ? 'warning' :
                statusCode >= 300 ? 'info' : 'success';
            return `<span class="badge text-bg-${style}">${escHtml(statusCode)}</span>`;
        }

        function renderRequests(data) {
            const container = document.getElementById('geo-requests');
            if (!data.content || !data.content.length) {
                container.innerHTML = '<div class="alert alert-light border mb-0">조건에 맞는 요청이 없습니다.</div>';
                return;
            }
            let html = '<h5 class="mb-3">Requests</h5><div class="table-responsive"><table class="table table-sm align-middle">' +
                '<thead><tr><th>Time</th><th>City</th><th>Status</th><th>Bot</th><th>URI</th></tr></thead><tbody>';
            data.content.forEach(row => {
                const timestamp = row.createdAt ? row.createdAt.replace('T', ' ').substring(0, 19) : '-';
                html += `<tr><td class="text-nowrap">${escHtml(timestamp)}</td><td>${escHtml(row.cityName || '-')}</td>` +
                    `<td>${statusBadge(row.statusCode)}</td><td>${row.bot ? 'Yes' : 'No'}</td>` +
                    `<td class="geo-request-uri">${escHtml(row.uri)}</td></tr>`;
            });
            html += '</tbody></table></div>' + paginationHtml(data, 'data-geo-request-page');
            container.innerHTML = html;
            container.querySelectorAll('[data-geo-request-page]').forEach(button => {
                button.addEventListener('click', () => {
                    requestPage = Number(button.dataset.geoRequestPage);
                    loadRequests();
                });
            });
        }

        function loadRequests() {
            const container = document.getElementById('geo-requests');
            if (!container) return;
            container.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary" role="status"></div></div>';
            fetchJson(`/api/admin/console/geo/countries/${encodeURIComponent(selectedCountry)}/requests`, {
                days: selectedDays(),
                includeBots: includeBots(),
                cityId: selectedCityId,
                page: requestPage
            }).then(renderRequests).catch(() => {
                container.innerHTML = '<div class="alert alert-danger mb-0">요청 목록을 불러오지 못했습니다.</div>';
            });
        }

        document.getElementById('geo-include-bots').addEventListener('change', () => {
            selectedCityId = null;
            requestPage = 0;
            if (selectedCountry) loadCountryDetail();
            else loadCountryList();
        });

        document.getElementById('geo-all-time').addEventListener('change', () => {
            selectedCityId = null;
            requestPage = 0;
            if (selectedCountry) loadCountryDetail();
            else loadCountryList();
        });

        document.getElementById('geo-backfill').addEventListener('click', event => {
            const button = event.currentTarget;
            button.disabled = true;
            button.textContent = '채우는 중…';
            fetch('/api/admin/console/geo/backfill', {
                method: 'POST', credentials: 'same-origin', headers: csrfHeaders()
            }).then(response => {
                if (!response.ok) throw new Error('API error ' + response.status);
                return response.json();
            }).then(data => {
                button.textContent = data.resolverAvailable ?
                    `완료: ${data.rowsUpdated}행` : 'City DB 없음';
                if (selectedCountry) loadCountryDetail();
                else loadCountryList();
            }).catch(() => {
                button.textContent = '채우기 실패';
            }).finally(() => {
                button.disabled = false;
            });
        });

        window.loadGeo = function (selectedDays) {
            if (selectedDays !== undefined && selectedDays !== days) {
                days = selectedDays;
                selectedCityId = null;
                requestPage = 0;
            }
            if (selectedCountry) loadCountryDetail();
            else loadCountryList();
        };
    })();
    </script>
</div>

</body>
</html>
