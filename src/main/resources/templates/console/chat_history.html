<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Chat History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown.min.css">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <style>
        .ip-list-item.active {
            background-color: #6c757d;
            color: white;
        }
        .ip-list-item.active .text-muted {
            color: #dee2e6 !important;
        }
        .chat-history-box {
            max-height: 75vh;
            overflow-y: auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Chat History</h1>
            <a th:href="@{/admin/console}" class="btn btn-sm btn-outline-secondary">← Admin Console</a>
        </div>

        <div class="row">
            <!-- IP List Panel -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Visitors</h5>
                    </div>
                    <div class="list-group list-group-flush" th:if="${!ipList.isEmpty()}">
                        <a th:each="entry : ${ipList.content}"
                           th:href="@{/admin/chat(ip=${entry.ip}, page=0, ipPage=${ipPage})}"
                           th:classappend="${entry.ip == selectedIp} ? 'active ip-list-item' : 'ip-list-item'"
                           class="list-group-item list-group-item-action">
                            <div class="fw-semibold" th:text="${entry.ip}"></div>
                            <small class="text-muted"
                                   th:text="${#temporals.format(entry.latest, 'yyyy-MM-dd HH:mm')}"></small>
                        </a>
                    </div>
                    <div class="card-body text-muted" th:if="${ipList.isEmpty()}">
                        <small>No conversations yet.</small>
                    </div>
                    <!-- IP list pagination -->
                    <div class="card-footer p-2" th:if="${ipList.totalPages > 1}">
                        <nav aria-label="IP page navigation">
                            <ul class="pagination pagination-sm mb-0 justify-content-center">
                                <li class="page-item" th:classappend="${ipList.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/admin/chat(ip=${selectedIp}, page=${page}, ipPage=${ipPage - 1})}">&laquo;</a>
                                </li>
                                <li class="page-item"
                                    th:each="i : ${#numbers.sequence(0, ipList.totalPages - 1)}"
                                    th:classappend="${i == ipPage} ? 'active'">
                                    <a class="page-link"
                                       th:href="@{/admin/chat(ip=${selectedIp}, page=${page}, ipPage=${i})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${ipList.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/admin/chat(ip=${selectedIp}, page=${page}, ipPage=${ipPage + 1})}">&raquo;</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- Conversations Panel -->
            <div class="col-md-9">
                <!-- No IP selected -->
                <div th:if="${selectedIp == null}" class="text-center text-muted mt-5">
                    <p>Select a visitor from the left to view their conversations.</p>
                </div>

                <!-- Conversations for selected IP -->
                <div th:if="${selectedIp != null}">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">
                            Conversations for <code th:text="${selectedIp}"></code>
                        </h5>
                        <span class="text-muted small"
                              th:if="${conversations != null}"
                              th:text="'Total: ' + ${conversations.totalElements}"></span>
                    </div>

                    <div class="chat-history-box" th:if="${conversations != null and !conversations.isEmpty()}">
                        <th:block th:each="conv : ${conversations.content}">
                            <div th:if="${conv != null}"
                                 th:replace="~{fragments/chat_fragment :: conversationEntry(${conv})}">
                            </div>
                        </th:block>
                    </div>

                    <div class="text-center text-muted mt-4"
                         th:if="${conversations == null or conversations.isEmpty()}">
                        <p>No conversations found for this IP.</p>
                    </div>

                    <!-- Conversation pagination -->
                    <nav aria-label="Conversation page navigation"
                         th:if="${conversations != null and conversations.totalPages > 1}"
                         class="mt-3">
                        <ul class="pagination pagination-sm justify-content-center">
                            <li class="page-item" th:classappend="${conversations.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/chat(ip=${selectedIp}, page=${page - 1}, ipPage=${ipPage})}">&laquo;</a>
                            </li>
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, conversations.totalPages - 1)}"
                                th:classappend="${i == page} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/admin/chat(ip=${selectedIp}, page=${i}, ipPage=${ipPage})}"
                                   th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${conversations.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/chat(ip=${selectedIp}, page=${page + 1}, ipPage=${ipPage})}">&raquo;</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Render AI responses as Markdown with DOMPurify sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.ai-response-content').forEach(function (el) {
                const raw = el.getAttribute('data-raw') || '';
                el.innerHTML = DOMPurify.sanitize(marked.parse(raw.replace(/\u00A0/g, ' ')));
            });
        });
    </script>
</th:block>
</body>
</html>
