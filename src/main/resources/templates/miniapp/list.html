<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}"
      th:with="
        pageTitle='Mini Apps | Yunseong',
        pageDescription='Yunseong의 미니 앱 모음입니다. HTML로 만든 가벼운 앱을 체험해보세요.',
        pageKeywords='미니앱, 데모, 웹 앱, 개발',
        pageUrl='/public/apps'">

<th:block layout:fragment="css"></th:block>

<body>
<th:block layout:fragment="content">
    <div class="container px-3 px-md-4">
        <h1 class="page-title">Mini Apps</h1>
        <a sec:authorize="isAuthenticated()" href="/admin/miniapps" class="btn btn-primary mb-3">
          <i class="bi bi-plus-lg"></i> Manage Mini App
        </a>
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 mb-4" th:each="app : ${miniApps}">
                <a th:href="@{/public/apps/{id}(id=${app.id})}" class="text-decoration-none">
                    <div class="card app-card h-100 shadow">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${app.title}">App Title</h5>
                            <p class="card-text text-muted small" th:text="${app.description}" th:if="${app.description != null and !app.description.isEmpty()}"></p>
                            <span class="badge bg-success">Open</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div th:if="${miniApps.isEmpty()}" class="alert alert-info" role="alert">
            No mini apps available at the moment.
        </div>
    </div>
</th:block>
</body>
</html>
