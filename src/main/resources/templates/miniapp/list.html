<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}"
      th:with="
        pageTitle='Mini Apps | Yunseong',
        pageDescription='Yunseong의 미니 앱 모음입니다. HTML로 만든 가벼운 앱을 체험해보세요.',
        pageKeywords='미니앱, 데모, 웹 앱, 개발',
        pageUrl='/public/apps'">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/showcase.css}">
</th:block>

<body>
<th:block layout:fragment="content">
    <div class="container px-3 px-md-4">
        <h1 class="page-title">Mini Apps</h1>

        <div class="showcase-toolbar">
            <p class="showcase-count"><span th:text="${#lists.size(miniApps)}">0</span> apps</p>
            <a sec:authorize="isAuthenticated()" href="/admin/miniapps" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-plus-lg"></i> Manage Mini App
            </a>
        </div>

        <!-- Mini apps carry no screenshot, so every item is a plain text row. -->
        <ul class="showcase-list" th:if="${!miniApps.isEmpty()}">
            <li class="showcase-row" th:each="app : ${miniApps}">
                <a th:href="@{/public/apps/{id}(id=${app.id})}" class="showcase-row__link">
                    <span class="showcase-row__body">
                        <span class="showcase-row__title" th:text="${app.title}">App Title</span>
                        <span class="showcase-row__desc" th:text="${app.description}" th:if="${app.description != null and !app.description.isEmpty()}"></span>
                        <span class="showcase-row__meta">
                            <span class="showcase-status">실행 가능</span>
                        </span>
                    </span>
                </a>
            </li>
        </ul>

        <p th:if="${miniApps.isEmpty()}" class="showcase-empty" role="status">
            No mini apps available at the moment.
        </p>
    </div>
</th:block>
</body>
</html>
