<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Edit Mini App</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h2 class="mb-0">Edit Mini App</h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/miniapps/edit/{id}(id=${miniApp.id})}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" th:value="${miniApp.title}" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3" th:text="${miniApp.description}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="appUrl" class="form-label">App URL</label>
                            <input type="url" class="form-control" id="appUrl" name="appUrl" th:value="${miniApp.appUrl}" placeholder="https://s3.example.com/myapp/index.html">
                            <div class="form-text">현재 URL: <span th:text="${miniApp.appUrl}" class="text-break"></span></div>
                        </div>
                        <div class="mb-3">
                            <label for="htmlFile" class="form-label">새 HTML 파일로 교체</label>
                            <input type="file" class="form-control" id="htmlFile" name="htmlFile" accept=".html,text/html">
                            <div class="form-text">파일을 업로드하면 기존 URL이 새 파일의 URL로 교체됩니다. URL이 함께 입력된 경우 파일보다 URL이 우선됩니다.</div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <a href="/admin/miniapps" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
