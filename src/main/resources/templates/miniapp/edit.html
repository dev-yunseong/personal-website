<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Edit Mini App</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h2 class="mb-0">Edit Mini App</h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/miniapps/edit/{id}(id=${miniApp.id})}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label for="htmlFile" class="form-label">새 HTML 파일로 교체</label>
                            <input type="file" class="form-control" id="htmlFile" name="htmlFile" accept=".html,text/html">
                            <div class="form-text">파일을 업로드하면 기존 URL이 새 파일의 URL로 교체됩니다. URL이 함께 입력된 경우 파일보다 URL이 우선됩니다.</div>
                        </div>
                        <div class="mb-3">
                            <label for="appUrl" class="form-label">App URL</label>
                            <input type="url" class="form-control" id="appUrl" name="appUrl" th:value="${miniApp.appUrl}" placeholder="https://example.com/myapp/index.html">
                            <div class="form-text">파일 업로드 대신 URL을 입력하면 해당 페이지의 내용으로 이름/설명을 생성할 수 있습니다.</div>
                        </div>
                        <div class="mb-3">
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="generateBtn" disabled>
                                <i class="bi bi-stars"></i> AI로 이름/설명 생성
                            </button>
                            <span id="generateStatus" class="ms-2 small text-muted"></span>
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" th:value="${miniApp.title}" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3" th:text="${miniApp.description}"></textarea>
                        </div>
                        <div class="d-flex justify-content-end">
                            <a href="/admin/miniapps" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';

        const fileInput = document.getElementById('htmlFile');
        const generateUrlInput = document.getElementById('appUrl');
        const generateBtn = document.getElementById('generateBtn');
        const generateStatus = document.getElementById('generateStatus');

        function updateGenerateBtn() {
            generateBtn.disabled = !fileInput.files.length && !generateUrlInput.value.trim();
        }

        fileInput.addEventListener('change', updateGenerateBtn);
        generateUrlInput.addEventListener('input', updateGenerateBtn);

        function callGenerateApi(payload) {
            fetch('/api/admin/miniapps/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) throw new Error('서버 오류: ' + res.status);
                return res.json();
            })
            .then(data => {
                if (data.error) {
                    generateStatus.textContent = '생성 실패: ' + data.error;
                } else {
                    document.getElementById('title').value = data.title || '';
                    document.getElementById('description').value = data.description || '';
                    generateStatus.textContent = '✓ 생성 완료';
                }
            })
            .catch(err => {
                generateStatus.textContent = '생성 중 오류가 발생했습니다: ' + err.message;
            })
            .finally(() => {
                generateBtn.disabled = false;
            });
        }

        generateBtn.addEventListener('click', function () {
            const url = generateUrlInput.value.trim();
            const file = fileInput.files[0];

            if (!url && !file) {
                generateStatus.textContent = 'HTML 파일 또는 URL을 입력해주세요.';
                return;
            }

            generateBtn.disabled = true;
            generateStatus.textContent = 'AI가 분석 중...';

            if (url) {
                callGenerateApi({ url: url });
            } else {
                const reader = new FileReader();
                reader.onload = function (e) {
                    callGenerateApi({ content: e.target.result });
                };
                reader.readAsText(file);
            }
        });
    </script>
</div>
</body>
</html>
