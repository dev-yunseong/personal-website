<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      th:with="
        pageTitle='Mini Apps 관리 | Yunseong',
        pageUrl='/admin/miniapps'">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/showcase.css}">
</th:block>

<body>
<th:block layout:fragment="content">
    <div class="container px-3 px-md-4">
        <h1 class="page-title">Mini Apps 관리</h1>

        <div class="showcase-toolbar">
            <p class="showcase-count"><span th:text="${#lists.size(miniApps)}">0</span> apps</p>
            <a href="/admin/miniapps/new" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> New Mini App
            </a>
        </div>

        <!-- A genuine tabular record, so it stays a table — framed with hairlines. -->
        <div class="table-responsive showcase-table" th:if="${!miniApps.isEmpty()}">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>App URL</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="app : ${miniApps}">
                        <td class="showcase-table__id" th:text="${app.id}"></td>
                        <td class="showcase-table__title" th:text="${app.title}"></td>
                        <td class="showcase-table__desc" th:text="${app.description}"></td>
                        <td>
                            <a th:href="${app.appUrl}" target="_blank" class="showcase-table__url text-break d-inline-block" th:text="${app.appUrl}"></a>
                        </td>
                        <td class="showcase-table__actions">
                            <a th:href="@{/public/apps/{id}(id=${app.id})}" class="btn btn-sm btn-outline-secondary me-1" target="_blank" title="실행" aria-label="실행">
                                <i class="bi bi-play-fill"></i>
                            </a>
                            <a th:href="@{/admin/miniapps/edit/{id}(id=${app.id})}" class="btn btn-sm btn-outline-secondary me-1" title="수정" aria-label="수정">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/miniapps/delete/{id}(id=${app.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="삭제" aria-label="삭제"
                                        onclick="return confirm('정말 삭제하시겠습니까?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p th:if="${miniApps.isEmpty()}" class="showcase-empty" role="status">
            등록된 미니 앱이 없습니다. <a href="/admin/miniapps/new">새로 만들어보세요.</a>
        </p>
    </div>
</th:block>
</body>
</html>
