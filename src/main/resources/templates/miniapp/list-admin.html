<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      th:with="
        pageTitle='Mini Apps 관리 | Yunseong',
        pageUrl='/admin/miniapps'">

<body>
<th:block layout:fragment="content">
    <div class="container px-3 px-md-4 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Mini Apps 관리</h1>
            <a href="/admin/miniapps/new" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> New Mini App
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>App URL</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="app : ${miniApps}">
                        <td th:text="${app.id}"></td>
                        <td th:text="${app.title}"></td>
                        <td class="text-muted small" th:text="${app.description}"></td>
                        <td>
                            <a th:href="${app.appUrl}" target="_blank" class="text-break small" th:text="${app.appUrl}"></a>
                        </td>
                        <td>
                            <a th:href="@{/public/apps/{id}(id=${app.id})}" class="btn btn-sm btn-outline-success me-1" target="_blank">
                                <i class="bi bi-play-fill"></i>
                            </a>
                            <a th:href="@{/admin/miniapps/edit/{id}(id=${app.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/miniapps/delete/{id}(id=${app.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('정말 삭제하시겠습니까?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${miniApps.isEmpty()}" class="alert alert-info" role="alert">
            등록된 미니 앱이 없습니다. <a href="/admin/miniapps/new">새로 만들어보세요.</a>
        </div>
    </div>
</th:block>
</body>
</html>
