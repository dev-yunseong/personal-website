<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>New Mini App</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h2 class="mb-0">New Mini App</h2>
                </div>
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        URL 또는 HTML 파일을 입력해주세요.
                    </div>
                    <form th:action="@{/admin/miniapps}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="appUrl" class="form-label">App URL</label>
                            <input type="url" class="form-control" id="appUrl" name="appUrl" placeholder="https://s3.example.com/myapp/index.html">
                            <div class="form-text">S3 URL 또는 외부 URL을 입력하세요.</div>
                        </div>
                        <div class="mb-3">
                            <label for="htmlFile" class="form-label">또는 HTML 파일 업로드</label>
                            <input type="file" class="form-control" id="htmlFile" name="htmlFile" accept=".html,text/html">
                            <div class="form-text">HTML 파일을 업로드하면 자동으로 S3/MinIO에 저장됩니다. URL이 함께 입력된 경우 파일보다 URL이 우선됩니다.</div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <a href="/admin/miniapps" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
