<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <!-- Page Title -->
    <title th:text="${pageTitle != null ? pageTitle : 'Yunseong - Personal Website'}">Yunseong - Personal Website</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" th:content="${pageDescription != null ? pageDescription : 'Yunseong의 개인 웹사이트입니다. 개발, 기술 블로그, 그리고 다양한 프로젝트를 공유합니다.'}">
    <meta name="keywords" th:content="${pageKeywords != null ? pageKeywords : '개발, 블로그, Yunseong, 프로그래밍, 기술'}">
    <meta name="author" content="Yunseong">
    
    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${pageTitle != null ? pageTitle : 'Yunseong - Personal Website'}">
    <meta property="og:description" th:content="${pageDescription != null ? pageDescription : 'Yunseong의 개인 웹사이트입니다. 개발, 기술 블로그, 그리고 다양한 프로젝트를 공유합니다.'}">
    <meta property="og:url" th:content="${@environment.getProperty('app.base-url') + (pageUrl != null ? pageUrl : '')}">
    <meta property="og:site_name" content="Yunseong">
    <meta property="og:image" th:content="${pageImage != null ? pageImage : @environment.getProperty('app.base-url') + '/favicon.ico'}">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" th:content="${pageTitle != null ? pageTitle : 'Yunseong - Personal Website'}">
    <meta name="twitter:description" th:content="${pageDescription != null ? pageDescription : 'Yunseong의 개인 웹사이트입니다. 개발, 기술 블로그, 그리고 다양한 프로젝트를 공유합니다.'}">
    <meta name="twitter:image" th:content="${pageImage != null ? pageImage : @environment.getProperty('app.base-url') + '/favicon.ico'}">
    
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <th:block layout:fragment="css"></th:block>
    <th:block layout:fragment="script"></th:block>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="site-main container">
        <th:block layout:fragment="content"></th:block>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
