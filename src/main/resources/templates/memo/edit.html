<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Edit Memo</title>
</head>
<th:block layout:fragment="css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown-light.css">
</th:block>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h2 class="mb-0">Edit Memo</h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/memos/edit/{id}(id=${memo.id})}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" th:value="${memo.name}"
                                   th:readonly="${isProfileMemo}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Content</label>
                            <ul class="nav nav-tabs mb-2" id="editorTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="writeTab" type="button" role="tab">Write</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="previewTab" type="button" role="tab">Preview</button>
                                </li>
                            </ul>
                            <div id="writePane">
                                <textarea class="form-control font-monospace" id="content" name="content" rows="20" th:text="${memo.content}"></textarea>
                                <div id="profileValidationStatus"
                                     class="alert mt-3 mb-0"
                                     th:classappend="${validationError != null ? 'alert-danger' : 'alert-secondary'}"
                                     th:style="${isProfileMemo ? '' : 'display: none;'}"
                                     role="status"
                                     aria-live="polite"
                                     th:text="${validationError != null ? validationError : 'Profile YAML has not been validated yet.'}">
                                    Profile YAML has not been validated yet.
                                </div>
                            </div>
                            <div id="previewPane" class="border rounded p-3 markdown-body" style="display: none; min-height: 400px;"></div>
                        </div>
                        <div class="mb-3" th:if="${!isProfileMemo}">
                            <label for="fileUpload" class="form-label">Upload File</label>
                            <input type="file" class="form-control" id="fileUpload">
                            <div class="form-text">Upload an image, video, or other file to insert into your memo</div>
                            <div id="uploadStatus" class="mt-2"></div>
                        </div>
                        <div class="mb-3" th:if="${!isProfileMemo}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isGameProject" name="isGameProject" value="true" 
                                       th:checked="${gameProject != null}">
                                <label class="form-check-label" for="isGameProject">
                                    This is a project (game, demo, etc.)
                                </label>
                            </div>
                        </div>
                        <div class="mb-3" id="gameProjectForm"
                             th:if="${!isProfileMemo}"
                             th:style="${gameProject != null ? 'display: block;' : 'display: none;'}">
                            <label for="gameUrl" class="form-label">Project URL</label>
                            <input type="url" class="form-control" id="gameUrl" name="gameUrl" placeholder="https://example.com"
                                   th:value="${gameProject != null ? gameProject.gameUrl : ''}">
                            <div class="form-text">Enter the URL where the project can be accessed</div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <button type="submit"
                                    class="btn btn-outline-danger"
                                    th:if="${!isProfileMemo}"
                                    th:formaction="@{/admin/memos/delete/{id}(id=${memo.id})}"
                                    formmethod="post"
                                    onclick="return confirm('Delete this memo? It will be moved to deleted memos.');">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                            <div class="ms-auto">
                                <a href="javascript:history.back()" class="btn btn-secondary me-2">Cancel</a>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </div>
                    </form>
                    <div th:replace="~{fragments/mermaid_katex_parser.html :: parser}"></div>
                    <script th:src="@{/js/memo-editor.js}"></script>
                    <script th:inline="javascript">
                        initMemoEditor({profileMemo: /*[[${isProfileMemo}]]*/ false});

                        const gameProjectCheckbox = document.getElementById('isGameProject');
                        if (gameProjectCheckbox) {
                            gameProjectCheckbox.addEventListener('change', function() {
                                const gameProjectForm = document.getElementById('gameProjectForm');
                                if (this.checked) {
                                    gameProjectForm.style.display = 'block';
                                } else {
                                    gameProjectForm.style.display = 'none';
                                }
                            });
                        }

                        const fileUpload = document.getElementById('fileUpload');
                        if (fileUpload) fileUpload.addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (!file) return;

                            const formData = new FormData();
                            formData.append('file', file);

                            const uploadStatus = document.getElementById('uploadStatus');
                            uploadStatus.innerHTML = '<span class="text-info">Uploading...</span>';

                            const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                            const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                            fetch('/admin/upload/file', {
                                method: 'POST',
                                headers: {
                                    [header]: token
                                },
                                body: formData
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.error) {
                                    uploadStatus.innerHTML = '<span class="text-danger">' + data.error + '</span>';
                                } else {
                                    const contentTextarea = document.getElementById('content');
                                    contentTextarea.value += '\n' + data.markdown + '\n';
                                    uploadStatus.innerHTML = '<span class="text-success">File uploaded and added to content!</span>';
                                    e.target.value = '';
                                }
                            })
                            .catch(error => {
                                uploadStatus.innerHTML = '<span class="text-danger">Upload failed: ' + error.message + '</span>';
                            });
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
