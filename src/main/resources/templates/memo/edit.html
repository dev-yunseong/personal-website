<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Edit Memo</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h2 class="mb-0">Edit Memo</h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/memos/edit/{id}(id=${memo.id})}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" th:value="${memo.name}">
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea class="form-control" id="content" name="content" rows="5" th:text="${memo.content}"></textarea>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isGameProject" name="isGameProject" value="true" 
                                       th:checked="${gameProject != null}">
                                <label class="form-check-label" for="isGameProject">
                                    This is a game project
                                </label>
                            </div>
                        </div>
                        <div class="mb-3" id="gameProjectForm" th:style="${gameProject != null ? 'display: block;' : 'display: none;'}">
                            <label for="gameUrl" class="form-label">Game URL</label>
                            <input type="url" class="form-control" id="gameUrl" name="gameUrl" placeholder="https://example.com"
                                   th:value="${gameProject != null ? gameProject.gameUrl : ''}">
                            <div class="form-text">Enter the URL where the game can be played</div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <a href="/" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                    <script>
                        document.getElementById('isGameProject').addEventListener('change', function() {
                            const gameProjectForm = document.getElementById('gameProjectForm');
                            if (this.checked) {
                                gameProjectForm.style.display = 'block';
                            } else {
                                gameProjectForm.style.display = 'none';
                            }
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
