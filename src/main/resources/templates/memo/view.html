<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}"
      th:with="
        pageTitle=${memo.title + ' | Yunseong'},
        pageKeywords=${memo.title + ', ' + memo.path + ', 블로그, 개발'},
        pageUrl=${'/public/memos/' + memo.id}">

<th:block layout:fragment="css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown-light.css">
    <!-- Prism.js CSS for syntax highlighting - GitHub style theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-ghcolors.min.css">
  <link rel="stylesheet" th:href="@{/css/memo-view.css}">
</th:block>

<body>
<th:block layout:fragment="content">
  <!--
    The reading surface. One column, no card: the article is the page, so a
    border around it only adds a second frame inside the browser window.
    Width is set by the measure (see memo-view.css), not by the grid.
  -->
  <div class="memo-page">

    <article class="memo-article" th:if="${memo != null}">
      <header class="memo-article__head">
        <nav class="memo-article__crumbs" aria-label="위치">
          <a class="memo-article__path"
             th:href="${memo.path != null and memo.path != '/'} ? @{/public/memos(category=${memo.path})} : @{/public/memos}"
             th:text="${memo.path != null and !#strings.isEmpty(memo.path)} ? ${memo.path} : '/'">/blog/spring</a>
        </nav>

        <h1 class="memo-article__title" th:text="${memo.title}">글 제목</h1>

        <div class="memo-article__meta"
             th:with="created=${memo.createdAt != null ? #temporals.format(memo.createdAt, 'yyyy-MM-dd') : null},
                      updated=${memo.updatedAt != null ? #temporals.format(memo.updatedAt, 'yyyy-MM-dd') : null}">
          <span class="memo-article__date" th:if="${created != null}">
            <span class="memo-article__date-label">작성</span>
            <time th:datetime="${created}" th:text="${created}">2026-06-19</time>
          </span>
          <span class="memo-article__date" th:if="${updated != null and !updated.equals(created)}">
            <span class="memo-article__date-label">수정</span>
            <time th:datetime="${updated}" th:text="${updated}">2026-08-10</time>
          </span>
          <a sec:authorize="isAuthenticated()"
             class="memo-article__edit"
             th:href="@{/admin/memos/edit/{id}(id=${memo.id})}">
            <i class="bi bi-pencil-square" aria-hidden="true"></i>
            <span>편집</span>
          </a>
        </div>
      </header>

      <!-- #markdown-content is the KaTeX render target; .markdown-body is the
           github-markdown-css hook. Neither may be renamed. -->
      <div class="memo-article__body markdown-body"
           id="markdown-content"
           th:utext="${memo.getHtml()}">Memo content goes here.</div>
    </article>

    <!-- Child documents of this memo, when it has any. The query behind
         `memos` always returns the memo itself, so a lone entry means
         "no children" and the whole block stays hidden. -->
    <nav class="memo-children" th:if="${memos != null and memos.totalElements > 1}" aria-label="하위 문서">
      <div class="memo-children__head">
        <h2>하위 문서</h2>
        <a class="memo-children__all" th:href="@{/public/memos}">전체 글</a>
      </div>
      <ul class="memo-list">
        <!-- th:each and th:replace must not share a tag: fragment inclusion has
             the higher precedence and would run once, before the loop. -->
        <th:block th:each="child : ${memos.content}">
          <th:block th:replace="~{fragments/memo_card_fragment :: memoRow(memo=${child})}"></th:block>
        </th:block>
      </ul>
      <div th:replace="~{fragments/page_navi_fragment :: pageNavi(memos=${memos}, selectedCategory=${selectedCategory})}"></div>
    </nav>

    <div th:replace="~{fragments/mermaid_katex_parser.html :: parser}"></div>

    <!-- Prism.js for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  </div>
</th:block>
</body>
</html>
