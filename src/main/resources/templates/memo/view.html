<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown-light.css">
</th:block>

<head>
    <title th:text="${memo.getTitle()}"> </title>
</head>

<body>
<th:block layout:fragment="content">
    <!-- Memo Section -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-12">
                <div th:replace="~{fragments/memo_fragment :: memoFragment}"></div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
