<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>New Memo</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h2 class="mb-0">New Memo</h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/memos}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" th:value="${category}">
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea class="form-control" id="content" name="content" rows="5"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="imageUpload" class="form-label">Upload Image</label>
                            <input type="file" class="form-control" id="imageUpload" accept="image/*">
                            <div class="form-text">Upload an image to insert into your memo</div>
                            <div id="uploadStatus" class="mt-2"></div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isGameProject" name="isGameProject" value="true">
                                <label class="form-check-label" for="isGameProject">
                                    This is a game project
                                </label>
                            </div>
                        </div>
                        <div class="mb-3" id="gameProjectForm" style="display: none;">
                            <label for="gameUrl" class="form-label">Game URL</label>
                            <input type="url" class="form-control" id="gameUrl" name="gameUrl" placeholder="https://example.com">
                            <div class="form-text">Enter the URL where the game can be played</div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <a href="/blog" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                    <script>
                        document.getElementById('isGameProject').addEventListener('change', function() {
                            const gameProjectForm = document.getElementById('gameProjectForm');
                            if (this.checked) {
                                gameProjectForm.style.display = 'block';
                            } else {
                                gameProjectForm.style.display = 'none';
                            }
                        });

                        document.getElementById('imageUpload').addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (!file) return;

                            const formData = new FormData();
                            formData.append('file', file);

                            const uploadStatus = document.getElementById('uploadStatus');
                            uploadStatus.innerHTML = '<span class="text-info">Uploading...</span>';

                            fetch('/admin/upload/image', {
                                method: 'POST',
                                body: formData
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.error) {
                                    uploadStatus.innerHTML = '<span class="text-danger">' + data.error + '</span>';
                                } else {
                                    const contentTextarea = document.getElementById('content');
                                    const markdown = data.markdown;
                                    contentTextarea.value += '\n' + markdown + '\n';
                                    uploadStatus.innerHTML = '<span class="text-success">Image uploaded and added to content!</span>';
                                    e.target.value = '';
                                }
                            })
                            .catch(error => {
                                uploadStatus.innerHTML = '<span class="text-danger">Upload failed: ' + error.message + '</span>';
                            });
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
