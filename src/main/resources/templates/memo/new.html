<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>New Memo</title>
</head>
<th:block layout:fragment="css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown-light.css">
</th:block>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h2 class="mb-0">New Memo</h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/memos}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" th:value="${category}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Content</label>
                            <ul class="nav nav-tabs mb-2" id="editorTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="writeTab" type="button" role="tab">Write</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="previewTab" type="button" role="tab">Preview</button>
                                </li>
                            </ul>
                            <div id="writePane">
                                <textarea class="form-control font-monospace" id="content" name="content" rows="20"></textarea>
                            </div>
                            <div id="previewPane" class="border rounded p-3 markdown-body" style="display: none; min-height: 400px;"></div>
                        </div>
                        <div class="mb-3">
                            <label for="fileUpload" class="form-label">Upload File</label>
                            <input type="file" class="form-control" id="fileUpload">
                            <div class="form-text">Upload an image, video, or other file to insert into your memo</div>
                            <div id="uploadStatus" class="mt-2"></div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isGameProject" name="isGameProject" value="true">
                                <label class="form-check-label" for="isGameProject">
                                    This is a project (game, demo, etc.)
                                </label>
                            </div>
                        </div>
                        <div class="mb-3" id="gameProjectForm" style="display: none;">
                            <label for="gameUrl" class="form-label">Project URL</label>
                            <input type="url" class="form-control" id="gameUrl" name="gameUrl" placeholder="https://example.com">
                            <div class="form-text">Enter the URL where the project can be accessed</div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <a href="javascript:history.back()" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                    <div th:replace="~{fragments/mermaid_katex_parser.html :: parser}"></div>
                    <script th:src="@{/js/memo-editor.js}"></script>
                    <script>
                        initMemoEditor();

                        document.getElementById('isGameProject').addEventListener('change', function() {
                            const gameProjectForm = document.getElementById('gameProjectForm');
                            if (this.checked) {
                                gameProjectForm.style.display = 'block';
                            } else {
                                gameProjectForm.style.display = 'none';
                            }
                        });

                        document.getElementById('fileUpload').addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (!file) return;

                            const formData = new FormData();
                            formData.append('file', file);

                            const uploadStatus = document.getElementById('uploadStatus');
                            uploadStatus.innerHTML = '<span class="text-info">Uploading...</span>';

                            const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                            const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                            fetch('/admin/upload/file', {
                                method: 'POST',
                                headers: {
                                    [header]: token
                                },
                                body: formData
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.error) {
                                    uploadStatus.innerHTML = '<span class="text-danger">' + data.error + '</span>';
                                } else {
                                    const contentTextarea = document.getElementById('content');
                                    contentTextarea.value += '\n' + data.markdown + '\n';
                                    uploadStatus.innerHTML = '<span class="text-success">File uploaded and added to content!</span>';
                                    e.target.value = '';
                                }
                            })
                            .catch(error => {
                                uploadStatus.innerHTML = '<span class="text-danger">Upload failed: ' + error.message + '</span>';
                            });
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
