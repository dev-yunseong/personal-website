<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Error</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container px-3 px-md-4">
        <!-- Editorial, not an alert dialog: the status code carries the meaning,
             so it is set as a figure rather than dressed with a warning icon. -->
        <section class="error-page" role="status">
            <p class="error-page__code" th:text="${statusCode != null ? statusCode : '—'}">500</p>
            <h1 class="error-page__title" th:text="${statusMessage != null ? statusMessage : 'Something went wrong'}">Error</h1>
            <p class="error-page__lead">
                요청하신 페이지를 열 수 없습니다. 주소를 다시 확인하시거나 아래에서 이어가세요.
            </p>
            <div class="error-page__links">
                <a href="/">홈으로</a>
                <a href="/public/memos">글 목록 보기</a>
            </div>
        </section>
    </div>
</th:block>
</body>
</html>
