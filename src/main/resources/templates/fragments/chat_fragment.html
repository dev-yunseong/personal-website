<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Live interactive chat UI, used in chat.html -->
<div th:fragment="chatBox">
    <div class="chat-container">
        <div class="card">
            <div class="card-header">
                <h1 class="h5 mb-0">Curator</h1>
                <button class="curator-memory-help" type="button" aria-describedby="curator-memory-tooltip">
                    <i class="bi bi-database-lock" aria-hidden="true"></i>
                    <span>Memory</span>
                    <span class="curator-memory-tooltip" id="curator-memory-tooltip" role="tooltip">
                        Curator can remember durable notes privately. Memory persists globally across sessions.
                    </span>
                </button>
            </div>
            <div class="card-body chat-box" id="chat-box">
                <!-- Messages will be appended here -->
            </div>
            <div class="card-footer">
                <form id="chat-form" class="d-flex">
                    <input type="text" id="message-input" class="form-control" placeholder="Type your message..." autocomplete="off"/>
                    <button type="submit" class="btn btn-secondary ms-2">Send</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Single conversation entry, used in admin chat history page -->
<div th:fragment="conversationEntry(conv)">
    <div class="message user-message">
        <div class="message-bubble">
            <strong>You</strong>
            <div class="content" th:text="${conv.userMessage}"></div>
        </div>
        <div class="avatar"></div>
    </div>
    <div class="message llm-message">
        <div class="avatar"></div>
        <div class="message-bubble markdown-body">
            <strong>Curator</strong>
            <div th:if="${conv.toolsUsed != null}" class="tool-status">
                <details class="tool-history">
                    <summary class="tool-history-summary">사용된 도구</summary>
                    <ul class="tool-history-list">
                        <li th:each="tool : ${#strings.arraySplit(conv.toolsUsed, ',')}"
                            th:text="${#strings.trim(tool)}"></li>
                    </ul>
                </details>
            </div>
            <div class="content ai-response-content" th:attr="data-raw=${conv.aiResponse}"></div>
        </div>
    </div>
    <div class="text-muted small text-end mb-3"
         th:text="${#temporals.format(conv.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></div>
    <hr/>
</div>

</body>
</html>
