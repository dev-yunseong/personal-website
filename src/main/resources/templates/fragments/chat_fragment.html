<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Live interactive chat UI, used in chat.html -->
<div th:fragment="chatBox">
    <div class="chat-container">
        <section class="chat-panel">
            <header class="chat-panel__head">
                <div class="chat-panel__identity">
                    <p class="chat-panel__eyebrow">AI CURATOR</p>
                    <h1 class="chat-panel__title">Curator</h1>
                </div>
                <!-- Nothing to remember while the curator is off; advertising it would mislead. -->
                <button class="curator-memory-help" type="button" aria-describedby="curator-memory-tooltip"
                        th:if="${curatorEnabled}">
                    <i class="bi bi-database-lock" aria-hidden="true"></i>
                    <span>Memory</span>
                    <span class="curator-memory-tooltip" id="curator-memory-tooltip" role="tooltip">
                        Curator can remember durable notes privately. Memory persists globally across sessions.
                    </span>
                </button>
            </header>

            <div class="chat-box" id="chat-box">
                <!-- Messages will be appended here -->
                <div class="chat-empty" th:if="${curatorEnabled}">
                    <p class="chat-empty__lead">
                        블로그 글, 이력서, 프로젝트 기록을 근거로 답변합니다. 궁금한 점을 자유롭게 물어보세요.
                    </p>
                    <p class="chat-empty__label">예시 질문</p>
                    <ul class="chat-empty__hints">
                        <li>어떤 기술 스택으로 일해 왔나요?</li>
                        <li>최근에 쓴 글 중 인프라 관련 내용을 요약해 주세요.</li>
                        <li>이 사이트는 어떤 구조로 만들어졌나요?</li>
                    </ul>
                </div>

                <!-- Curator unavailable: say that much and no more. Why it is off is the
                     operator's business, and the startup log already tells them. -->
                <div class="chat-empty chat-empty--off" th:unless="${curatorEnabled}" role="status">
                    <p class="chat-empty__label">이용할 수 없음</p>
                    <p class="chat-empty__lead">
                        큐레이터를 지금은 이용할 수 없습니다.
                        블로그 글은 그대로 읽으실 수 있습니다.
                    </p>
                    <div class="chat-empty__links">
                        <a href="/public/memos">글 목록 보기</a>
                        <a href="/">홈으로</a>
                    </div>
                </div>
            </div>

            <div class="chat-panel__composer" th:if="${curatorEnabled}">
                <form id="chat-form" class="chat-form">
                    <label class="visually-hidden" for="message-input">Message</label>
                    <input type="text" id="message-input" class="form-control chat-form__input"
                           placeholder="Type your message..." autocomplete="off"/>
                    <button type="submit" class="btn chat-form__send">Send</button>
                </form>
                <p class="chat-form__note">Enter를 누르면 전송됩니다. 답변은 이 사이트의 공개 자료를 근거로 생성됩니다.</p>
            </div>
        </section>
    </div>
</div>

<!-- Single conversation entry, used in admin chat history page -->
<div th:fragment="conversationEntry(conv)" class="chat-entry">
    <div class="message user-message">
        <div class="message-bubble">
            <strong>You</strong>
            <div class="content" th:text="${conv.userMessage}"></div>
        </div>
        <div class="avatar"></div>
    </div>
    <div class="message llm-message">
        <div class="avatar"></div>
        <div class="message-bubble markdown-body">
            <strong>Curator</strong>
            <div th:if="${conv.toolsUsed != null}" class="tool-status">
                <details class="tool-history">
                    <summary class="tool-history-summary">사용된 도구</summary>
                    <ul class="tool-history-list">
                        <li th:each="tool : ${#strings.arraySplit(conv.toolsUsed, ',')}"
                            th:text="${#strings.trim(tool)}"></li>
                    </ul>
                </details>
            </div>
            <div class="content ai-response-content" th:attr="data-raw=${conv.aiResponse}"></div>
        </div>
    </div>
    <p class="chat-entry__time"
       th:text="${#temporals.format(conv.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></p>
</div>

</body>
</html>
