<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!--
      Self-contained player styles. This block is pulled into the consuming
      page's `layout:fragment="css"`, which the layout emits after site.css, so
      these declarations win on source order. The two `!important`s exist only
      to beat site.css's `.game-iframe-container` rule, which is itself
      `!important`; both can drop the moment that rule is deleted.
    -->
    <th:block th:fragment="gamePlayerCss">
        <style>
            /* 16:9 box via padding-bottom rather than aspect-ratio: the
               fullscreen overrides below unset it, and the absolutely
               positioned iframe keeps the frame from ever exceeding the
               column width. */
            .game-iframe-container {
                background: var(--sunken);
                border: 1px solid var(--border);
                border-radius: var(--r-surface) !important;
                box-shadow: none !important;
                height: 0;
                margin-bottom: var(--sp-8);
                max-width: 100%;
                overflow: hidden;
                padding-bottom: 56.25%;
                position: relative;
                width: 100%;
            }
            .game-iframe-container iframe {
                border: 0;
                display: block;
                height: 100%;
                left: 0;
                position: absolute;
                top: 0;
                width: 100%;
            }
            /* Primary action, so ink — the accent stays reserved for state. */
            .game-iframe-container .fullscreen-btn {
                background: var(--ink);
                border: 1px solid var(--ink);
                border-radius: var(--r-control);
                bottom: var(--sp-3);
                color: var(--ink-on);
                cursor: pointer;
                font-family: var(--font-sans);
                font-size: var(--fs-label);
                font-weight: 600;
                line-height: var(--lh-tight);
                padding: var(--sp-2) var(--sp-3);
                position: absolute;
                right: var(--sp-3);
                transition: background-color var(--dur-fast) var(--ease),
                            border-color var(--dur-fast) var(--ease);
                z-index: 10;
            }
            .game-iframe-container .fullscreen-btn:hover {
                background: var(--text-secondary);
                border-color: var(--text-secondary);
            }
            .game-iframe-container .fullscreen-btn:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 2px;
            }
            .game-iframe-container:fullscreen {
                padding-bottom: 0;
                height: 100vh;
            }
            .game-iframe-container:-webkit-full-screen {
                padding-bottom: 0;
                height: 100vh;
            }
            .game-iframe-container:-moz-full-screen {
                padding-bottom: 0;
                height: 100vh;
            }
            .game-iframe-container:-ms-fullscreen {
                padding-bottom: 0;
                height: 100vh;
            }
            /* Mobile improvements */
            @media (max-width: 576px) {
                .game-iframe-container .fullscreen-btn {
                    bottom: var(--sp-2);
                    font-size: var(--fs-meta);
                    padding: var(--sp-1) var(--sp-2);
                    right: var(--sp-2);
                }
                .game-iframe-container {
                    margin-bottom: var(--sp-6);
                }
            }
        </style>
    </th:block>

    <th:block th:fragment="gamePlayerScript">
        <script>
            // Bootstrap's sm breakpoint (576px)
            const MOBILE_BREAKPOINT = 576;

            function isFullscreen() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                         document.mozFullScreenElement || document.msFullscreenElement);
            }

            function toggleFullscreen() {
                const container = document.getElementById('gameContainer');

                if (!isFullscreen()) {
                    // Enter fullscreen
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    } else if (container.mozRequestFullScreen) {
                        container.mozRequestFullScreen();
                    } else if (container.msRequestFullscreen) {
                        container.msRequestFullscreen();
                    }
                } else {
                    // Exit fullscreen
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            }

            // Update button text when entering/exiting fullscreen
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
            document.addEventListener('mozfullscreenchange', updateFullscreenButton);
            document.addEventListener('MSFullscreenChange', updateFullscreenButton);

            function updateFullscreenButton() {
                const fullscreenBtn = document.getElementById('fullscreenBtn');
                const isMobile = window.innerWidth < MOBILE_BREAKPOINT;
                if (isFullscreen()) {
                    fullscreenBtn.innerHTML = isMobile ? '<i class="bi bi-fullscreen-exit"></i>' : '<i class="bi bi-fullscreen-exit"></i> 전체 화면 종료';
                } else {
                    fullscreenBtn.innerHTML = isMobile ? '<i class="bi bi-arrows-fullscreen"></i>' : '<i class="bi bi-arrows-fullscreen"></i> 전체 화면';
                }
            }
        </script>
    </th:block>
</head>
<body>
    <div th:fragment="gamePlayer" class="game-iframe-container" id="gameContainer" th:if="${gameUrl != null}">
        <iframe th:src="${gameUrl}"
                allowfullscreen
                title="Game">
        </iframe>
        <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
            <i class="bi bi-arrows-fullscreen"></i><span class="d-none d-sm-inline"> 전체 화면</span>
        </button>
    </div>
</body>
</html>
