<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="gamePlayerCss">
        <style>
            .game-iframe-container {
                position: relative;
                width: 100%;
                padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
                height: 0;
                overflow: hidden;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                margin-bottom: 2rem;
            }
            .game-iframe-container iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }
            .fullscreen-btn {
                position: absolute;
                bottom: 10px;
                right: 10px;
                z-index: 10;
                background-color: rgba(0, 0, 0, 0.6);
                color: white;
                border: none;
                border-radius: 4px;
                padding: 8px 12px;
                cursor: pointer;
                transition: background-color 0.2s;
                font-size: 0.875rem;
            }
            .fullscreen-btn:hover {
                background-color: rgba(0, 0, 0, 0.8);
            }
            .game-iframe-container:fullscreen {
                padding-bottom: 0;
                height: 100vh;
            }
            .game-iframe-container:-webkit-full-screen {
                padding-bottom: 0;
                height: 100vh;
            }
            .game-iframe-container:-moz-full-screen {
                padding-bottom: 0;
                height: 100vh;
            }
            .game-iframe-container:-ms-fullscreen {
                padding-bottom: 0;
                height: 100vh;
            }
            /* Mobile improvements */
            @media (max-width: 576px) {
                .fullscreen-btn {
                    font-size: 0.75rem;
                    padding: 6px 10px;
                    bottom: 5px;
                    right: 5px;
                }
                .game-iframe-container {
                    border-radius: 4px;
                    margin-bottom: 1.5rem;
                }
            }
        </style>
    </th:block>
    
    <th:block th:fragment="gamePlayerScript">
        <script>
            // Bootstrap's sm breakpoint (576px)
            const MOBILE_BREAKPOINT = 576;
            
            function isFullscreen() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement || 
                         document.mozFullScreenElement || document.msFullscreenElement);
            }
            
            function toggleFullscreen() {
                const container = document.getElementById('gameContainer');
                
                if (!isFullscreen()) {
                    // Enter fullscreen
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    } else if (container.mozRequestFullScreen) {
                        container.mozRequestFullScreen();
                    } else if (container.msRequestFullscreen) {
                        container.msRequestFullscreen();
                    }
                } else {
                    // Exit fullscreen
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            }
            
            // Update button text when entering/exiting fullscreen
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
            document.addEventListener('mozfullscreenchange', updateFullscreenButton);
            document.addEventListener('MSFullscreenChange', updateFullscreenButton);
            
            function updateFullscreenButton() {
                const fullscreenBtn = document.getElementById('fullscreenBtn');
                const isMobile = window.innerWidth < MOBILE_BREAKPOINT;
                if (isFullscreen()) {
                    fullscreenBtn.innerHTML = isMobile ? '<i class="bi bi-fullscreen-exit"></i>' : '<i class="bi bi-fullscreen-exit"></i> 전체 화면 종료';
                } else {
                    fullscreenBtn.innerHTML = isMobile ? '<i class="bi bi-arrows-fullscreen"></i>' : '<i class="bi bi-arrows-fullscreen"></i> 전체 화면';
                }
            }
        </script>
    </th:block>
</head>
<body>
    <div th:fragment="gamePlayer" class="game-iframe-container" id="gameContainer" th:if="${gameUrl != null}">
        <iframe th:src="${gameUrl}" 
                allowfullscreen
                title="Game">
        </iframe>
        <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
            <i class="bi bi-arrows-fullscreen"></i><span class="d-none d-sm-inline"> 전체 화면</span>
        </button>
    </div>
</body>
</html>
