<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<section th:fragment="recentMemosSection" class="home-recent" aria-labelledby="home-recent-title">
    <div class="section-head">
        <h2 id="home-recent-title">최근 글</h2>
        <a class="section-head__all" href="/public/memos">전체 보기</a>
    </div>

    <ul class="memo-list" th:if="${!#lists.isEmpty(recentMemos)}">
        <th:block th:each="memo : ${recentMemos}"
                  th:replace="~{fragments/memo_card_fragment :: memoRow(memo=${memo})}"></th:block>
    </ul>

    <p class="memo-list__empty" th:if="${#lists.isEmpty(recentMemos)}">
        아직 공개된 글이 없습니다.
    </p>
</section>
</body>
</html>
