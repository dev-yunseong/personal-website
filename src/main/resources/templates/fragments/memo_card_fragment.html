<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<a th:href="@{/public/memos/{id}(id=${memo.id})}" th:fragment="memoCard(memo)" class="card mb-3 text-decoration-none text-dark shadow-sm">
    <div class="card-body">
        <div class="memo-card__meta">
            <span th:text="${memo.getPath()}">/path/to</span>
            <time th:text="${#temporals.format(memo.updatedAt, 'yyyy-MM-dd')}">2026-06-19</time>
        </div>
        <div class="memo-card__main">
            <h5 class="card-title" th:text="${memo.getTitle()}">Memo Title</h5>
            <i class="bi bi-arrow-up-right memo-card__arrow" aria-hidden="true"></i>
        </div>
    </div>
</a>
</body>
</html>
