<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="categoryList(categories, selectedCategory)">
    <div class="card">
        <div class="card-header">
            Categories
        </div>
        <div class="list-group list-group-flush">
            <a th:href="@{/public/memos}" class="list-group-item list-group-item-action" th:classappend="${selectedCategory == null} ? 'active' : ''">
                All
            </a>
            <a th:each="category : ${categories}"
               th:href="@{/public/memos(category=${category})}"
               class="list-group-item list-group-item-action"
               th:classappend="${#strings.equals(selectedCategory, category)} ? 'active' : ''">
                <span th:text="${category}"></span>
            </a>
        </div>
    </div>
</div>

<div th:fragment="categoryTree(categoryTree, selectedCategory)">
    <div class="card">
        <div class="card-header">
            Categories
        </div>
        <div class="list-group list-group-flush">
            <a th:href="@{/public/memos}" class="list-group-item list-group-item-action" th:classappend="${selectedCategory == null} ? 'active' : ''">
                All
            </a>
            <div th:each="node : ${categoryTree}">
                <div th:replace="~{fragments/category_fragment :: categoryNode(node=${node}, selectedCategory=${selectedCategory}, level=1)}"></div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="categoryNode(node, selectedCategory, level)">
    <a th:href="@{/public/memos(category=${node.fullPath})}"
       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
       th:classappend="${#strings.equals(selectedCategory, node.fullPath)} ? 'active' : ''"
       th:with="paddingLeft=${1 + (level - 1) * 1.5}"
       th:style="${level > 1} ? 'padding-left: ' + ${paddingLeft} + 'rem;' : ''">
        <span th:text="${node.name}"></span>
        <button th:if="${node.hasChildren()}"
                type="button"
                class="btn btn-sm btn-link p-0 ms-2 text-decoration-none category-toggle"
                th:attr="data-bs-target='#collapse-' + ${node.safeId}, aria-expanded=${node.containsPath(selectedCategory)} ? 'true' : 'false'"
                data-bs-toggle="collapse"
                onclick="event.preventDefault(); event.stopPropagation();">
            <i class="bi bi-chevron-down"></i>
        </button>
    </a>
    <div th:if="${node.hasChildren()}"
         th:id="'collapse-' + ${node.safeId}"
         th:classappend="${node.containsPath(selectedCategory)} ? 'show' : ''"
         class="collapse">
        <div th:each="child : ${node.children}">
            <div th:replace="~{fragments/category_fragment :: categoryNode(node=${child}, selectedCategory=${selectedCategory}, level=${level + 1})}"></div>
        </div>
    </div>
</div>
</body>
</html>
