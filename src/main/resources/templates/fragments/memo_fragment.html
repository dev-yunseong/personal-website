<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<div th:fragment="memoFragment" th:if="${memo != null}" class="card shadow-lg border-0 w-100">

    <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <h5 class="card-title" th:text="${memo.name}">Memo Title</h5>
        <a th:href="@{/admin/memos/edit/{id}(id=${memo.id})}" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-pencil-square"></i>
        </a>
    </div>
    <div class="card-body markdown-body" id="markdown-content">
        <p class="card-text fs-5" th:utext="${memo.getHtml()}">Memo content goes here.</p>
    </div>

  <div th:replace="~{fragments/mermaid_katex_parser.html :: parser}"></div>

</div>
</body>
</html>
