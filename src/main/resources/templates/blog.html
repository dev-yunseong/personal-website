<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}"
      th:with="
        pageTitle=${selectedCategory != null and !#strings.isEmpty(selectedCategory) ? 'Blog - ' + selectedCategory + ' | Yunseong' : 'Blog | Yunseong'},
        pageDescription=${selectedCategory != null and !#strings.isEmpty(selectedCategory) ? 'Yunseong의 블로그 - ' + selectedCategory + ' 카테고리의 게시글을 확인하세요.' : 'Yunseong의 기술 블로그입니다. 개발 관련 글과 프로젝트를 공유합니다.'},
        pageKeywords=${'블로그, 개발, 기술, 프로그래밍' + (selectedCategory != null and !#strings.isEmpty(selectedCategory) ? ', ' + selectedCategory : '')},
        pageUrl=${'/public/memos' + (selectedCategory != null and !#strings.isEmpty(selectedCategory) ? '?category=' + selectedCategory : '')}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/category.css}">
</th:block>

<body>
<th:block layout:fragment="content">
    <div class="container px-3 px-md-4">
        <h1 class="page-title">Blog</h1>

        <!-- Search Bar -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <div th:replace="~{fragments/search_bar_fragment :: searchBar}"></div>
                <div th:replace="~{fragments/search_bar_fragment :: searchBarScript}"></div>
            </div>
        </div>

        <div th:if="${keyword != null}">
            <h2>Search results for "[[${keyword}]]"</h2>
        </div>

        <a sec:authorize="isAuthenticated()" th:if="${keyword == null}" th:href="@{/admin/memos/new(category=${selectedCategory})}" class="btn btn-primary mb-3">Write a new memo</a>
        <div class="row">
            <!-- Category sidebar - shown at top on mobile -->
            <div th:if="${keyword == null}" class="col-12 col-md-3 order-md-2 mb-4 mb-md-0">
                <div th:replace="~{fragments/category_fragment :: categoryTree(categoryTree=${categoryTree}, selectedCategory=${selectedCategory})}"></div>
            </div>
            <!-- Main content -->
            <div th:classappend="${keyword != null} ? 'col-12' : 'col-md-9 order-md-1'">
                <div th:if="${memos.hasContent()}" th:each="memo : ${memos.content}">
                    <div th:replace="~{fragments/memo_card_fragment :: memoCard(memo=${memo})}">
                    </div>
                </div>
                <div th:if="${!memos.hasContent()}">
                    <p>No memos found.</p>
                </div>
                <div th:replace="~{fragments/page_navi_fragment :: pageNavi(memos=${memos}, selectedCategory=${selectedCategory})}"></div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
