<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      th:with="
        pageTitle='정윤성 (Yunseong Jeong) | Software Engineer',
        pageDescription='Software Engineer 정윤성(Yunseong Jeong)의 개인 웹사이트입니다. AI agent, 실시간 게임 서버, 백엔드 프로젝트와 기술 글을 공유합니다.',
        pageKeywords='개발, 블로그, Yunseong, 프로그래밍, 기술, 웹개발',
        pageUrl=''">

<th:block layout:fragment="css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown-light.css">
    <!-- Prism.js CSS for syntax highlighting - GitHub style theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-ghcolors.min.css">
    <link rel="stylesheet" th:href="@{/css/memo-view.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</th:block>

<th:block layout:fragment="script">
    <script type="application/ld+json" th:if="${profileJsonLd != null}" th:utext="${profileJsonLd}"></script>
</th:block>

<body>
<th:block layout:fragment="content">
    <div th:replace="~{fragments/home_hero_fragment :: homeHero}"></div>

    <div class="home-content">
        <div th:replace="~{fragments/home_recent_memos_fragment :: recentMemosSection}"></div>

        <!-- Search Bar -->
        <div class="home-search">
            <div th:replace="~{fragments/search_bar_fragment :: searchBar}"></div>
            <div th:replace="~{fragments/search_bar_fragment :: searchBarScript}"></div>
        </div>
    </div>
</th:block>
</body>
</html>
