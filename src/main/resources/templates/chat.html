<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Chat with Curator</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Yunseong의 개인 웹사이트에서 제공하는 AI 큐레이터와 대화해보세요. 블로그 글, 이력서, 포트폴리오 등 웹사이트의 모든 정보를 기반으로 답변해줍니다.">
    <meta name="keywords" content="AI, 챗봇, Chat, Curator, Yunseong, AI 큐레이터, 기술, 블로그, 포트폴리오, 이력서">
    <meta name="author" content="Yunseong">

    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Chat with Curator - Yunseong">
    <meta property="og:description" content="Yunseong의 개인 웹사이트에서 제공하는 AI 큐레이터와 대화해보세요. 블로그 글, 이력서, 포트폴리오 등 웹사이트의 모든 정보를 기반으로 답변해줍니다.">
    <meta property="og:url" th:content="${@environment.getProperty('app.base-url') + '/chat'}">
    <meta property="og:site_name" content="Yunseong">
    <meta property="og:image" th:content="${@environment.getProperty('app.base-url') + '/favicon.ico'}">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Chat with Curator - Yunseong">
    <meta name="twitter:description" content="Yunseong의 개인 웹사이트에서 제공하는 AI 큐레이터와 대화해보세요. 블로그 글, 이력서, 포트폴리오 등 웹사이트의 모든 정보를 기반으로 답변해줍니다.">
    <meta name="twitter:image" th:content="${@environment.getProperty('app.base-url') + '/favicon.ico'}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown.min.css">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/chat_fragment :: chatBox}"></div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script th:src="@{/js/chat.js}"></script>
</div>
</body>
</html>
