spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
          # Spring AI's OpenAiChatProperties defaults this to 0.7, and reasoning
          # models reject anything but 1, so leaving it unset is a 400 on every
          # request. 1 is also OpenAI's own default for the older models, so it
          # stays correct whatever OPENAI_CHAT_MODEL is set to.
          temperature: 1.0

      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        table-name: vector_store
    mcp:
      client:
        enabled: true
        type: SYNC
        stdio:
          connections:
            tavily:
              command: npx
              args:
                - "-y"
                - "tavily-mcp@latest"
              env:
                TAVILY_API_KEY: ${TAVILY_API_KEY:}