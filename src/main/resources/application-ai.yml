spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-5.4-mini

      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        table-name: vector_store
    mcp:
      client:
        streamable-http:
          connections:
            tavily-mcp:
              # Required: obtain a free API key at https://app.tavily.com
              url: https://mcp.tavily.com/mcp/?tavilyApiKey=${TAVILY_API_KEY}