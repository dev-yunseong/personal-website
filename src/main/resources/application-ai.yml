spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Any OpenAI-compatible provider works here; the path stays /v1/....
      # DeepSeek: OPENAI_BASE_URL=https://api.deepseek.com, OPENAI_CHAT_MODEL=deepseek-chat
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.4-mini}
          # Spring AI's OpenAiChatProperties defaults this to 0.7, and reasoning
          # models reject anything but 1, so leaving it unset is a 400 on every
          # request. 1 is also OpenAI's own default for the older models, so it
          # stays correct whatever OPENAI_CHAT_MODEL is set to.
          temperature: 1.0

      embedding:
        # Embeddings keep their own connection because a chat provider may not
        # serve /v1/embeddings at all (DeepSeek does not). Point these at OpenAI
        # to keep RAG alive while the chat model lives elsewhere; leave them
        # unset and embeddings follow the chat connection, failing soft if that
        # provider has no embedding endpoint.
        base-url: ${EMBEDDING_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
        api-key: ${EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        table-name: vector_store
    mcp:
      client:
        enabled: true
        type: SYNC
        stdio:
          connections:
            tavily:
              command: npx
              args:
                - "-y"
                - "tavily-mcp@latest"
              env:
                TAVILY_API_KEY: ${TAVILY_API_KEY:}