spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}

      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        table-name: vector_store
    mcp:
      client:
        enabled: true
        type: SYNC
        stdio:
          connections:
            tavily:
              command: npx
              args:
                - "-y"
                - "tavily-mcp@latest"
              env:
                TAVILY_API_KEY: ${TAVILY_API_KEY:}