plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.yunseong'
version = '0.0.1-SNAPSHOT'
description = 'personal-website'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

jar {
    enabled = false
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven {
        name = 'Central Portal Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
    maven {
        url = uri("https://maven.pkg.github.com/dev-yunseong/api-limit-webflux")
        credentials {
            username = project.findProperty('GITHUB_ACTOR') ?: System.getenv("GITHUB_USERNAME")
            password = project.findProperty('GITHUB_TOKEN') ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // ai
    implementation platform("org.springframework.ai:spring-ai-bom:1.1.2")
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation "org.springframework.ai:spring-ai-rag"
    implementation "org.springframework.ai:spring-ai-markdown-document-reader"
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'

    // mark down
    implementation 'org.commonmark:commonmark:0.25.1'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.25.1'
    implementation 'org.yaml:snakeyaml'

    // database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // geo ip (local MaxMind GeoLite2 lookup, no external call on the request path)
    implementation 'com.maxmind.geoip2:geoip2:4.2.1'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testImplementation 'org.springframework.security:spring-security-test'

    // S3 storage
    implementation 'software.amazon.awssdk:s3:2.20.26'

    implementation 'dev.yunseong:api-limit-mvc:0.0.1'

    implementation 'net.bytebuddy:byte-buddy:1.14.12'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.flyway.enabled', 'false'
}
