# Local development infrastructure.
#
#   docker compose up -d
#   ./gradlew bootRun
#
# Values are read from the same `.env` the application uses, so the database
# credentials here and in DATABASE_URL cannot drift apart. Copy `.env.example`
# to `.env` first; the defaults below match the example file.
#
# This brings up only what the app cannot start without:
#   - PostgreSQL with pgvector, hstore, uuid-ossp and pg_trgm (Flyway V1 needs all four)
#   - MinIO, plus a one-shot job that creates the bucket and opens it for reads
#     so uploaded images resolve through S3_PUBLIC_URL
#
# Not included: OpenAI and Tavily are hosted services — put real keys in `.env`.
# The GeoLite2 database is optional; a missing file just leaves geo fields null.

name: personal-website

services:
  db:
    # pgvector's own image, so `CREATE EXTENSION vector` in V1__initial_schema.sql
    # works without building anything. The other three extensions ship with contrib.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-website}
      POSTGRES_USER: ${DATABASE_USER:-website}
      POSTGRES_PASSWORD: ${DATABASE_PW:-website}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Named user and database, otherwise pg_isready checks the wrong defaults
      # and reports ready before the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-website} -d ${POSTGRES_DB:-website}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # MinIO requires a root password of at least 8 characters.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # One-shot: create the bucket and allow anonymous downloads. Without the
  # download policy the app uploads fine but S3_PUBLIC_URL returns 403, so
  # images render broken.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-personal-website-files}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://storage:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET_NAME"
        mc anonymous set download "local/$$S3_BUCKET_NAME"
        echo "bucket $$S3_BUCKET_NAME ready"
    restart: "no"

volumes:
  db-data:
  storage-data:
